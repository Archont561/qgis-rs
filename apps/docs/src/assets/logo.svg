<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/>
  
  <!-- QGIS-inspired map layers -->
  <g transform="translate(100, 100)">
    <!-- Bottom layer -->
    <rect x="-60" y="20" width="120" height="8" rx="2" fill="#93c5fd" opacity="0.7"/>
    
    <!-- Middle layer -->
    <rect x="-55" y="5" width="110" height="8" rx="2" fill="#dbeafe" opacity="0.8"/>
    
    <!-- Top layer -->
    <rect x="-50" y="-10" width="100" height="8" rx="2" fill="#ffffff" opacity="0.9"/>
    
    <!-- Rust gear symbol -->
    <g transform="translate(0, -35)">
      <circle cx="0" cy="0" r="18" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#ffffff"/>
      
      <!-- Gear teeth -->
      <g fill="#f97316" stroke="#c2410c" stroke-width="1">
        <rect x="-3" y="-25" width="6" height="8" rx="1"/>
        <rect x="-3" y="17" width="6" height="8" rx="1"/>
        <rect x="-25" y="-3" width="8" height="6" rx="1"/>
        <rect x="17" y="-3" width="8" height="6" rx="1"/>
        <rect x="-20" y="-20" width="6" height="8" rx="1" transform="rotate(45)"/>
        <rect x="14" y="-20" width="6" height="8" rx="1" transform="rotate(-45)"/>
        <rect x="-20" y="12" width="6" height="8" rx="1" transform="rotate(-45)"/>
        <rect x="14" y="12" width="6" height="8" rx="1" transform="rotate(45)"/>
      </g>
    </g>
  </g>
  
  <!-- Text -->
  <text x="100" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1e40af" text-anchor="middle">
    qgis-rs
  </text>
</svg>
