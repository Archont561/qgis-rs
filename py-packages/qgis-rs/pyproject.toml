[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qgis-rs"
version = "0.1.0"
description = "Deprecated name of qgis-py. `import qgis_rs` keeps working for one release and re-exports qgis_py."
readme = "README.md"
# Same interpreter range as qgis-py, which this package depends on.
requires-python = ">=3.12,<3.13"
license = { text = "GPL-2.0-or-later" }
keywords = ["qgis", "gis", "deprecated"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
]
# The compatibility alias needs the real distribution and nothing else. The
# pin keeps `qgis-rs` and `qgis-py` from drifting apart.
dependencies = ["qgis-py==0.1.0"]

[project.scripts]
qgis-rs = "qgis_rs.cli:main"

[project.urls]
Homepage = "https://github.com/Archont561/qgis-rs"
Repository = "https://github.com/Archont561/qgis-rs"
Documentation = "https://archont561.github.io/qgis-rs/"

[tool.hatch.build.targets.wheel]
packages = ["python/qgis_rs"]
