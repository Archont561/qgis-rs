{% set name = "qgis-sdk" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../../../..

build:
  number: 0
  script:
    # Pure Python, built with the setuptools backend declared in pyproject.toml.
    - python -m pip install py-packages/qgis-sdk --no-deps -vv
  entry_points:
    - qgis-sdk = qgis_sdk.cli:main

requirements:
  build:
    - python
    - pip
    - setuptools >=77
  host:
    - python
    - pip
    - setuptools >=77
    - qgis >=3.44.9,<4
  run:
    - python
    - qgis >=3.44.9,<4
    # Optional: qgis-py for rendering tools
    # - qgis-py

test:
  imports:
    - qgis_sdk
    - qgis_sdk.cli
    - qgis_sdk.scaffold
  commands:
    - qgis-sdk --help
    - qgis-sdk version
    - qgis-sdk new test_plugin --type general -o /tmp
    - qgis-sdk validate /tmp/test_plugin
    - python -m qgis_sdk.cli --help
    - python -c "import qgis_sdk; print(qgis_sdk.__version__)"
    - python -c "from qgis_sdk import Plugin, action, toolbar; print('Plugin SDK OK')"
  requires:
    - pip

about:
  home: https://github.com/Archont561/qgis-rust
  license: GPL-2.0-or-later
  license_family: GPL
  summary: Python SDK for building QGIS plugins on top of PyQGIS, with a typer-based CLI
  description: |
    qgis-sdk is a pure-Python framework for building QGIS plugins.

    Features:
    - `pip install qgis-sdk` or `conda install -c conda-forge qgis-sdk`
    - `import qgis_sdk` — Python SDK with declarative Plugin, Algorithm APIs
    - `qgis-sdk` console command — scaffold, validate, build, test, package, publish plugins
    - Works without QGIS installed; only `qgis_sdk.runtime` touches PyQGIS, lazily
  doc_url: https://archont561.github.io/qgis-rust/
  dev_url: https://github.com/Archont561/qgis-rust

extra:
  recipe-maintainers:
    - Archont561
