{% set name = "qgis-sdk" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../../..

build:
  number: 0
  script:
    # Build Rust binaries (qgis-sdk) and Python extension via maturin
    - cargo build --release --manifest-path crates/qgis-sdk/Cargo.toml --bins
    - mkdir -p $PREFIX/bin
    - cp target/release/qgis-sdk $PREFIX/bin/qgis-sdk
    - chmod +x $PREFIX/bin/qgis-sdk
    # Also include qgis-cli for convenience (canonical bin in crates/qgis-cli;
    # crates/qgis-py is the extension module only and has no bin targets)
    - cargo build --release --manifest-path crates/qgis-cli/Cargo.toml --bin qgis-cli
    - cp target/release/qgis-cli $PREFIX/bin/qgis-cli || true
    - chmod +x $PREFIX/bin/qgis-cli || true
    # Build Python wheel with maturin
    - (cd py-packages/qgis-sdk && maturin build --release --strip -o ../../dist --interpreter python)
    - pip install dist/qgis_sdk-*.whl --no-deps -vv
  entry_points:
    - qgis-sdk = qgis_sdk.cli:main
    - qgis-cli = qgis_sdk.cli:qgis_cli_main

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - python
    - pip
    - maturin >=1.7
  host:
    - python
    - pip
    - maturin >=1.7
    - qgis >=3.44.9,<4
  run:
    - python
    - qgis >=3.44.9,<4
    # Optional: qgis-py for rendering tools
    # - qgis-py

test:
  imports:
    - qgis_sdk
    - qgis_sdk.cli
    - qgis_sdk.scaffold
  commands:
    - qgis-sdk --help
    - qgis-sdk version
    - qgis-sdk --help
    - qgis-sdk version
    - qgis-sdk new test_plugin --type general -o /tmp
    - qgis-sdk validate /tmp/test_plugin
    - python -m qgis_sdk.cli --help
    - python -c "import qgis_sdk; print(qgis_sdk.__version__, qgis_sdk.HAS_RUST)"
    - python -c "from qgis_sdk import Plugin, action, toolbar; print('Plugin SDK OK')"
  requires:
    - pip

about:
  home: https://github.com/Archont561/qgis-rust
  license: GPL-2.0-or-later
  license_family: GPL
  summary: Python SDK for building QGIS plugins on top of PyQGIS — with Rust-native CLI and acceleration
  description: |
    qgis-sdk is a Python framework for building QGIS plugins — in Python, Rust, or both.

    Features:
    - `pip install qgis-sdk` or `conda install -c conda-forge qgis-sdk`
    - `import qgis_sdk` — Python SDK with declarative Plugin, Algorithm APIs
    - `qgis-sdk` binary (Rust) — scaffold, build, test, package, publish plugins at native speed
    - `qgis-sdk` binary — alias for qgis-sdk
    - `qgis-cli` — also included for rendering/tiling when qgis-py is installed
    - Rust acceleration optional via `qgis-sdk rust init`
    - Pure-Python fallback when Rust extension not built — tests work without cargo
  doc_url: https://archont561.github.io/qgis-rust/
  dev_url: https://github.com/Archont561/qgis-rust

extra:
  recipe-maintainers:
    - Archont561
