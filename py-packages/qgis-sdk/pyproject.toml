[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qgis-sdk"
version = "0.1.0"
description = "Python SDK for building QGIS plugins on top of PyQGIS, with a typer-based CLI"
readme = "README.md"
# The Python this wheel supports is the one QGIS is bundled with, not a range of
# its own. A plugin SDK is useless on any other interpreter, since `import
# qgis` only resolves under the ABI its bindings were built for. Keep this in
# step with `python` in the root pixi.toml and the qgis build's ABI.
requires-python = ">=3.12,<3.13"
license = { text = "GPL-2.0-or-later" }
keywords = ["qgis", "gis", "plugin", "pyqgis", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
# No hard PyPI deps — QGIS comes from conda-forge qgis package for full backend,
# but pure-Python SDK works without QGIS for testing.
dependencies = ["typer>=0.27,<1", "questionary>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.168,<7"]
dev = ["pytest>=8", "hypothesis>=6.168,<7"]

[project.urls]
Homepage = "https://github.com/Archont561/qgis-rust"
Repository = "https://github.com/Archont561/qgis-rust"
Issues = "https://github.com/Archont561/qgis-rust/issues"
Documentation = "https://archont561.github.io/qgis-rust/"

[project.scripts]
qgis-sdk = "qgis_sdk.cli:main"

[project.entry-points.pytest11]
qgis_sdk = "qgis_sdk.testing"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The bridge JS and its manifest are data files, not Python modules, so they
# must be listed or the wheel ships without them.
qgis_sdk = ["assets/bridge/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
