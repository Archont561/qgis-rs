# py-packages/qgis-sdk/pixi.toml — the `qgis-sdk` workspace package.
#
# The Rust core it compiles lives in crates/qgis-sdk.
#
# This manifest carries the `[package]` section for the pixi workspace.
# It is pulled into an environment as a source dependency and built with
# pixi-build-python (maturin backend) to provide both Python API and Rust CLI.

[package]
name        = "qgis-sdk"
version     = "0.1.0"
description = "Python SDK for building QGIS plugins on top of PyQGIS — with Rust-native CLI and acceleration"
# QGIS plugins must be GPL-compatible, matching crates/* (Cargo workspace).
license = "GPL-2.0-or-later"

# pixi-build-python with maturin backend — builds Rust extension + binary
[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]

[package.host-dependencies]
# Build backend + Rust toolchain + maturin
hatchling = "*"
maturin = ">=1.7,<2"
rust = ">=1.96.0,<1.97"

[package.run-dependencies]
# qgis is the whole point: the conda-forge package ships the PyQGIS bindings
# under $CONDA_PREFIX/share/qgis/python *and* depends on the Python interpreter
# they were built against, so `python` is deliberately not declared here — it
# arrives as part of the QGIS environment and can never drift out of sync.
qgis = ">=3.44.9,<4"

[package.build.config]
# Use maturin as build backend — pyproject.toml already declares it
