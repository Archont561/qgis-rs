# py-packages/qgis-py/pixi.toml — the `qgis-py` Python package with Rust extension.
#
# Only the Python side lives here; the Rust crate it builds is crates/qgis-py,
# reached through [tool.maturin].manifest-path in the sibling pyproject.toml.
#
# This manifest carries the [package] section for the pixi workspace.
# It is pulled into an environment as a source dependency and built with
# pixi-build-python (maturin backend).
#
# The package provides:
# - Python API `import qgis_py` at native Rust speed (PyO3)
# - Console scripts `qgis-cli` and `qgis-py` via Python (maturin's pyo3
#   bindings ship no Rust bin; the standalone binary is crates/qgis-cli)

[package]
name = "qgis-py"
version = "0.1.0"
description = "Curated Python API for QGIS — a PyQGIS replacement backed by a native Rust engine"
license = "GPL-2.0-or-later"

[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]

[package.host-dependencies]
# Build backend + Rust toolchain + maturin
hatchling = ">=1.32.4,<2"
maturin = ">=1.7,<2"
rust = ">=1.96.0,<1.97"

[package.run-dependencies]
# Python >=3.9, no QGIS required for pure-Rust ops (tiles --dry-run, info, etc.)
# QGIS is optional but recommended for full rendering.
# The interpreter is whatever QGIS is bundled with, pinned to that build's ABI.
# Not a standalone range: PyQGIS bindings only import under the exact python they
# were compiled against. Keep in step with `python` in the root pixi.toml.
python = "3.12.*"

# For full backend, user can install qgis via conda-forge separately.
# We do NOT hard-depend on qgis here to keep pure-Rust install lightweight,
# but conda-forge recipe will add it as optional.
# qgis = ">=3.44.9,<4"  # uncomment for full backend

[package.build.config]
# Use maturin as build backend — pyproject.toml already declares it.
# pixi-build-python will call `maturin build` via hatchling.
