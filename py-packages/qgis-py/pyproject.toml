[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "qgis-py"
version = "0.1.0"
description = "Curated Python API for QGIS — a PyQGIS replacement backed by a native Rust engine"
readme = "README.md"
# The Python this wheel supports is the one QGIS is bundled with, not a range of
# its own. PyO3 0.22 additionally refuses an interpreter newer than 3.13. Keep
# this in step with `python` in the root pixi.toml and the qgis build's ABI.
requires-python = ">=3.12,<3.13"
license = { text = "GPL-2.0-or-later" }
keywords = ["qgis", "gis", "rendering", "tiles", "cli", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6.168,<7"]

[project.urls]
Homepage = "https://github.com/Archont561/qgis-rust"
Repository = "https://github.com/Archont561/qgis-rust"
Issues = "https://github.com/Archont561/qgis-rust/issues"
Documentation = "https://archont561.github.io/qgis-rust/"

[project.scripts]
qgis-cli = "qgis_py.cli:binary_main"
qgis-py = "qgis_py.cli:main"

[tool.maturin]
features = ["pyo3/extension-module", "python"]
# The Rust core lives in the Cargo workspace, not here: maturin is pointed at
# the crate and the paths below stay relative to this directory.
manifest-path = "src-rust/Cargo.toml"
module-name = "qgis_py._core"
python-source = "python"
bindings = "pyo3"
strip = true
# Bytecode caches come from running Python in the source tree (pytest, the CLI
# shim). They are machine-specific and must never ship in a wheel.
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests", "python"]

[tool.ruff]
line-length = 100
target-version = "py39"
