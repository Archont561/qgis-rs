name: Python and Node packages

on:
  pull_request:
    branches: [main]
    paths:
      - "py-packages/**"
      - "ts-packages/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    tags: ["v*", "qgis-rs-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-python:
    name: Test Python and Node packages (pure Rust, no QGIS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin pytest

      - name: Build and install qgis-rs with maturin develop
        # The pyproject owns the build: [tool.maturin].manifest-path points at
        # crates/qgis-py, so maturin is driven from the Python package.
        working-directory: py-packages/qgis-rs
        run: |
          # maturin reads ./pyproject.toml, whose [tool.maturin].manifest-path
          # points at ../../crates/qgis-py.
          maturin develop

      - name: Test qgis-rs API (Python)
        run: |
          python -m pytest py-packages/qgis-rs/tests -v
          python -c "import qgis_rs; print(qgis_rs.__version__); e = qgis_rs.Extent.parse('14,50,15,51'); print(e); print(qgis_rs.TilePlan(e, qgis_rs.ZoomRange.parse('10-14')).tile_count())"

      - name: Test qgis-rs CLI via Python
        run: |
          python -m qgis_rs.cli --help
          python -m qgis_rs.cli version
          qgis-cli --help
          qgis-cli version
          tmp=$(mktemp -d)
          echo "<qgis></qgis>" > $tmp/map.qgs
          qgis-cli info $tmp/map.qgs
          qgis-cli info $tmp/map.qgs --json
          qgis-cli tiles $tmp/map.qgs -z 10-14 -b 14,50,15,51 -o $tmp/tiles --dry-run

      - name: Build and install qgis-sdk with maturin develop
        working-directory: py-packages/qgis-sdk
        run: |
          maturin develop

      - name: Test qgis-sdk API and CLI
        run: |
          python -m pytest py-packages/qgis-sdk/tests -v
          python -m qgis_sdk.cli --help
          python -m qgis_sdk.cli version
          qgis-plugin --help
          qgis-plugin version
          tmp=$(mktemp -d)
          qgis-plugin new test_plugin --type general -o $tmp
          qgis-plugin validate $tmp/test_plugin
          qgis-plugin info $tmp/test_plugin

      - name: Test qgis-node (TypeScript) with fallback and NAPI build
        working-directory: ts-packages/qgis-node
        run: |
          npm install
          npm test
          node ../../examples/typescript_api.js
          # Build NAPI addon and test again with native
          npx napi build --platform --release --manifest-path ../../crates/qgis-node/Cargo.toml -o .
          npm test
          node -e "const { TilePlan, Extent, ZoomRange } = require('./index.js'); console.log('native tileCount', new TilePlan(Extent.parse('14,50,15,51'), ZoomRange.parse('10-14')).tileCount())"

  build-wheels:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - package: qgis-rs
            project: py-packages/qgis-rs
          - package: qgis-sdk
            project: py-packages/qgis-sdk
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels for ${{ matrix.package }}
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # maturin must be run *inside* the distribution directory: its -m flag
          # only accepts a Cargo.toml, so the pyproject -> crate hop is resolved
          # from the working directory instead.
          working-directory: ${{ matrix.project }}
          args: --release -o ../../dist --strip
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.package }}
          path: dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
