# Publish the reviewed development environments through pixi-sandbox's
# reusable release-mode workflow.
name: publish_sandbox

on:
  # Run only after the CI workflow completes on main; the job below also gates
  # on the conclusion because workflow_run fires for both successes and fails.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sandbox
  cancel-in-progress: false

jobs:
  sandbox:
    name: Publish sandbox bundles
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    uses: Archont561/pixi-sandbox/.github/workflows/publish-sandbox.yml@3d7a61825c165c161d4e13df78ee589d0eafc2f1 # v0.2.0, 2026-09-23
    with:
      # Environments and platforms come from the reviewed .pixi-sandbox.toml;
      # leave overrides empty so the reusable workflow reads the plan.
      config: .pixi-sandbox.toml
      release-repository: Archont561/pixi-sandbox
      release-ref: 3d7a61825c165c161d4e13df78ee589d0eafc2f1
      release-version: v0.2.0
      checksums-asset: SHA256SUMS
    secrets:
      SANDBOX_PUSH_TOKEN: ${{ secrets.SANDBOX_PUSH_TOKEN }}
