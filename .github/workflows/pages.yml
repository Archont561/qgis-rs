# pages.yml — build the Astro docs site and publish it to GitHub Pages.
#
# Runs on every push to main that touches the docs app (and on demand).
# The build job installs the pixi `docs` environment, builds apps/docs with
# bun, and uploads apps/docs/dist as the Pages artifact. The deploy job
# publishes that artifact to https://archont561.github.io/qgis-rs/.
#
# One-time setup (repository admin):
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# The site is built with `base: '/qgis-rs'` (see apps/docs/astro.config.mjs),
# which is what makes it work under the project subpath.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: configure pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      - name: install docs environment
        run: pixi install -e docs

      - name: install dependencies
        working-directory: apps/docs
        run: pixi run -e docs bun install --frozen-lockfile

      - name: build documentation
        working-directory: apps/docs
        run: pixi run -e docs bun run build

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
