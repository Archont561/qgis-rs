# Builds the Astro/Starlight site only after the CI workflow completes
# successfully, and deploys it to Pages when the green CI run targeted main.
# Note: workflow_run workflows only fire once this file exists on the default
# branch, and CI conclusion gating happens at job level below.
name: Docs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # Deploy only for the main branch (successful CI on a main push, or a
  # manual dispatch against main); PR CI runs only validate the build.
  DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') }}

jobs:
  build:
    name: Build documentation site
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run checks out the default branch by default; pin the
          # exact commit the parent CI run validated.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      - name: Install the Bun environment
        run: pixi install -e bun --locked

      # apps/docs is a member of the root Bun workspace; install from the root
      # lockfile first, then let turbo run the package's own build script.
      - name: Build documentation
        run: |
          pixi run -e bun bun-install
          pixi run -e bun bun x turbo run build --filter=qgis-rs-docs

      - name: Configure GitHub Pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: Publish to GitHub Pages
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
