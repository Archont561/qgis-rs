# Build the Astro/Starlight site for pull requests and publish it to Pages
# after changes land on main.
name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "package.json"
      - "pixi.toml"
      - "pixi.lock"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "package.json"
      - "pixi.toml"
      - "pixi.lock"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment that is already in progress.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      - name: Install docs environment
        run: pixi install -e docs --locked

      # apps/docs is a member of the root Bun workspace, so install at the
      # workspace root against the committed bun.lock.
      - name: Install documentation dependencies
        run: pixi run -e docs bun install --frozen-lockfile

      - name: Build documentation
        working-directory: apps/docs
        run: pixi run -e docs bun run build

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
