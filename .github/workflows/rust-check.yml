# rust-check.yml — compile and test everything that does not need QGIS
#
# qgis-sys needs the QGIS headers, so the pixi-based ci.yml owns that crate.
# Every other crate in the workspace is backend-agnostic and can be checked on
# a plain Rust runner in about a minute, which makes this the fast signal.
#
# The logs are posted back to the commit, because Actions log storage is not
# always reachable from every network.

name: Rust check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, arena/01a0b1e6-qgis-rs]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo fmt, check, clippy, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: format
        run: |
          set -o pipefail
          # Scoped to the backend-agnostic crates: qgis-sys is owned by ci.yml.
          # The PyO3 / NAPI crates count as backend-agnostic since the layout split
          # put them in crates/ — they are workspace members, so leaving them out of
          # this list would let rustfmt drift go unnoticed.
          FMT="-p qgis-render -p qgis-server -p qgis-mcp -p qgis-cli -p qgis-py -p qgis-sdk -p qgis-node -p qgis-styles"
          cargo fmt $FMT 2>&1 | tee /tmp/fmt.log
          cargo fmt $FMT -- --check 2>&1 | tee /tmp/fmt-check.log

      - name: check
        run: |
          set -o pipefail
          cargo check --workspace --exclude qgis-sys --all-targets 2>&1 | tee /tmp/check.log

      - name: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude qgis-sys --all-targets -- -D warnings 2>&1 |
            tee /tmp/clippy.log

      - name: test
        run: |
          set -o pipefail
          cargo test --workspace --exclude qgis-sys --no-fail-fast 2>&1 | tee /tmp/test.log

      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Rust check for ${GITHUB_SHA}"
            echo
            for step in fmt-check check clippy test; do
              echo "#### $step"
              echo '```text'
              tail -n 150 "/tmp/$step.log" 2>/dev/null || echo "(no log)"
              echo '```'
            done
          } > /tmp/report.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/report.md)"

      - name: commit the lockfile and rustfmt output
        # Never let CI write to main; on a working branch it saves a round trip
        # for developers who do not have cargo locally.
        #
        # Push events only: on a pull_request the ref is `N/merge`, so
        # `git push origin HEAD:$GITHUB_REF_NAME` used to target a GitHub-owned ref
        # and the step failed on every PR. The author pushes instead.
        if: always() && github.event_name == 'push' && github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Whole `crates` tree: any workspace member may be reformatted above.
          git add Cargo.lock crates
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Cargo.lock and apply rustfmt [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
