# GENERATED by `pixi-sandbox init github` (v0.3.1) — do not restructure by hand.
#
# To regenerate after upgrading the pinned release:
#   git rm .pixi-sandbox.toml .github/workflows/publish-sandbox.yml scripts/restore.sh scripts/restore.ps1
#   curl -fsSL https://github.com/Archont561/pixi-sandbox/releases/download/v0.3.1/install.sh | sh
# …then reapply the local edits marked "local" below.
#
# LOCAL EDITS (the generator does not produce these):
#   1. push-path filter, so only a sandbox-input change republishes;
#   2. least-privilege permissions: read at the top, write only on `publish`;
#   3. concurrency groups, so a rerun cannot race an in-flight publish;
#   4. `timeout-minutes` on both jobs;
#   5. every third-party action pinned to a 40-char commit SHA.
#
# Unlike v0.2.0 this needs no matrix fixup: v0.3.1 emits
# `fromJSON(...).include`, which drops the top-level `schema` key that made
# `strategy.matrix` uninitializable in run 35982903709.
name: publish sandbox

on:
  # Only a change to an actual input of the sandbox snapshot republishes; any
  # other push leaves the published branch alone. `workflow_run` cannot filter
  # by path, so this does not wait for CI; `workflow_dispatch` always publishes.
  push:
    branches: [main]
    paths:
      - ".pixi-sandbox.toml"
      - "pixi.toml"
      - "pixi.lock"
      - "package.json"
      - "bun.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ts-packages/qgis-node/package.json"
      - "ts-packages/qgis-node/Cargo.toml"
      - "ts-packages/qgis-node/build.rs"
      - "ts-packages/qgis-node/package-scripts/**"
      - ".github/workflows/publish-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sandbox
  cancel-in-progress: false

jobs:
  plan:
    name: validate sandbox publish plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: sandbox
        uses: Archont561/pixi-sandbox/setup@26e13491ea341c198981e55ecf86b8210e8c93f9
        with:
          version: v0.3.1
      - id: plan
        shell: bash
        run: echo "matrix=$(pixi-sandbox plan --config .pixi-sandbox.toml --json)" >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.bundle }} · ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: sandbox-publish-${{ github.repository }}-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true
          environments: ${{ matrix.environments }}
      - id: sandbox
        uses: Archont561/pixi-sandbox/setup@26e13491ea341c198981e55ecf86b8210e8c93f9
        with:
          version: v0.3.1
      - uses: Archont561/pixi-sandbox/publish@26e13491ea341c198981e55ecf86b8210e8c93f9
        with:
          project: .
          environments: ${{ matrix.environments }}
          platform: ${{ matrix.platform }}
          branch: ${{ matrix.branch }}
          cargo-vendor: ${{ matrix.cargo_vendor }}
          self-bin: ${{ steps.sandbox.outputs.path }}
          remote: ${{ github.server_url }}/${{ github.repository }}.git
          output-dir: ${{ runner.temp }}/pixi-sandbox-transport
          push-token: ${{ secrets.SANDBOX_PUSH_TOKEN || github.token }}
