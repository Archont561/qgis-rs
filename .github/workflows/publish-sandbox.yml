# Generated by pixi-sandbox init — local policy edits follow (see LOCAL EDITS).
# pixi-sandbox-version: 0.5.1
#
# To regenerate after upgrading the pinned release:
#   git rm pixi-sandbox.toml .github/workflows/publish-sandbox.yml \
#          .github/workflows/relock.yml scripts/restore.sh
#   pixi global install --channel https://prefix.dev/archont561/archont561 \
#                       --channel conda-forge "pixi-sandbox==<version>"
#   pixi sandbox init --project-root . --script-path scripts/restore.sh
# …then reapply the local edits marked "local" below. The scheduled `upgrade`
# job proposes regenerated files in a PR — review that PR against this list,
# because `init` output does not carry these edits (pixi-sandbox#79).
#
# LOCAL EDITS (the generator does not produce these):
#   1. push-path filter, so only a sandbox-input change republishes;
#   2. least-privilege permissions: read at the top, write only on `publish`
#      (the generated `upgrade` job already carries its own block);
#   3. concurrency groups, so a rerun cannot race an in-flight publish;
#   4. `timeout-minutes` on every job;
#   5. `pixi-version` pinned on all setup-pixi steps, and its cache disabled
#      everywhere — pixi-sandbox owns the native `pixi install` invocation
#      while packing the checked-out project (see qgis-rs#9), so an action
#      cache keyed on the manifest could restore a solve pixi-sandbox is not
#      going to reuse (qgis-rs#12).
#   6. no "Download released pixi-sandbox" step on `publish`: the binary
#      `pixi global install` puts on $PATH from $PIXI_SANDBOX_CHANNEL is the
#      same released artifact, already checksum-verified against the channel's
#      repodata, so the pack/publish steps call it off $PATH. The v0.5.1
#      generated bootstrap also can never pass: it pipes bare asset names into
#      `sha256sum --check` from the checkout cwd while the file sits in
#      $RUNNER_TEMP (pixi-sandbox#87). The `upgrade` job's bootstrap is kept
#      as generated — it rewrites the checksum line to an absolute path and
#      works.
name: publish sandbox

on:
  # local (edit 1): only a change to an actual input of the sandbox snapshot
  # republishes; any other push leaves the published branch alone.
  # `workflow_run` cannot filter by path, so this does not wait for CI;
  # `workflow_dispatch` with a blank `upgrade` input always publishes.
  push:
    branches: [main]
    paths:
      - "pixi-sandbox.toml"
      - "pixi.toml"
      - "pixi.lock"
      - "package.json"
      - "bun.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ts-packages/qgis-node/package.json"
      - "ts-packages/qgis-node/Cargo.toml"
      - "ts-packages/qgis-node/build.rs"
      - "ts-packages/qgis-node/package-scripts/**"
      - "ts-packages/test-utils/package.json"
      - "py-packages/qgis-rs/pyproject.toml"
      - "py-packages/qgis-sdk/pyproject.toml"
      - ".github/workflows/publish-sandbox.yml"
  # A bare `schedule:` run and a `workflow_dispatch` naming `upgrade` both route to the
  # `upgrade` job below instead of an ordinary publish — see that job's `if:` and its
  # neighbours'. Leaving `upgrade` blank on a manual dispatch keeps today's behaviour exactly.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      upgrade:
        description: >-
          Exact pixi-sandbox version to propose in an upgrade pull request (for example
          1.2.3). Leave blank for an ordinary manual publish run.
        required: false
        default: ""

# local (edit 2): read at the top; `publish` and `upgrade` name their own
# write permissions below.
permissions:
  contents: read

# local (edit 3): a rerun cannot race an in-flight run of this workflow.
concurrency:
  group: publish-sandbox
  cancel-in-progress: false

env:
  PIXI_SANDBOX_VERSION: 0.5.1
  PIXI_SANDBOX_CHANNEL: https://prefix.dev/archont561/archont561

jobs:
  plan:
    # The weekly schedule and an `upgrade`-naming dispatch both belong to the `upgrade` job
    # instead; an ordinary dispatch (the input left blank) still runs the normal publish.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upgrade == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15 # local (edit 4)
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0 # local (edit 5)
          run-install: false
          cache: false # local (edit 5)
      - name: Install pixi-sandbox CLI
        shell: bash
        run: >-
          pixi global install
          --channel "$PIXI_SANDBOX_CHANNEL"
          --channel conda-forge
          "pixi-sandbox==${PIXI_SANDBOX_VERSION}"
      - id: plan
        shell: bash
        run: echo "matrix=$(pixi-sandbox plan --config pixi-sandbox.toml --json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    strategy:
      fail-fast: false
      # `include:` nested under `matrix:`, not `matrix:` itself. `plan --json` emits
      # {"schema":1,"include":[...]}, and Actions requires strategy.matrix to be an object.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120 # local (edit 4)
    # local (edit 2): the only job that pushes the sandbox branch.
    permissions:
      contents: write
    # local (edit 3): one publish per sandbox branch at a time.
    concurrency:
      group: sandbox-publish-${{ github.repository }}-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # local (edit 5): only install the Pixi executable here. Cache-key
      # generation must not inspect the manifest: pixi-sandbox controls the
      # native `pixi install` while packing the checked-out project (qgis-rs#9).
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false
      - name: Install pixi-sandbox CLI
        shell: bash
        run: >-
          pixi global install
          --channel "$PIXI_SANDBOX_CHANNEL"
          --channel conda-forge
          "pixi-sandbox==${PIXI_SANDBOX_VERSION}"

      # local (edit 6): the binary `pixi global install` put next to `pixi` on
      # $PATH is the released artifact for this runner's platform, verified by
      # pixi against the channel's repodata hashes — no separate download, and
      # no broken `sha256sum --check` bootstrap (pixi-sandbox#87).
      - name: Pack, verify, and publish
        if: runner.os != 'Windows'
        shell: bash
        env:
          ENVIRONMENTS: ${{ matrix.environments }}
          PLATFORM: ${{ matrix.platform }}
          BRANCH: ${{ matrix.branch }}
          CARGO_VENDOR: ${{ matrix.cargo_vendor }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SELF_BIN="$(command -v pixi-sandbox)"
          IFS=',' read -ra ENVS <<< "$ENVIRONMENTS"
          for ENVIRONMENT in "${ENVS[@]}"; do
            pixi install --frozen -e "${ENVIRONMENT//[[:space:]]/}"
          done
          TRANSPORT="$RUNNER_TEMP/pixi-sandbox-transport"
          rm -rf "$TRANSPORT"
          CARGO_VENDOR_ARG=
          if [ "$CARGO_VENDOR" = true ]; then CARGO_VENDOR_ARG=--cargo-vendor; fi
          "$SELF_BIN" pack \
            --repo-root . \
            --envs "$ENVIRONMENTS" \
            --output-dir "$TRANSPORT" \
            --platform "$PLATFORM" \
            --fetch-tools \
            --self-bin "$SELF_BIN" \
            $CARGO_VENDOR_ARG
          "$SELF_BIN" doctor --branch-location "$TRANSPORT" --verify
          BASIC_AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $BASIC_AUTH"
          "$SELF_BIN" publish --input-dir "$TRANSPORT" --branch-name "$BRANCH" --remote "$REMOTE"

      - name: Pack, verify, and publish
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ENVIRONMENTS: ${{ matrix.environments }}
          PLATFORM: ${{ matrix.platform }}
          BRANCH: ${{ matrix.branch }}
          CARGO_VENDOR: ${{ matrix.cargo_vendor }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          PUSH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $selfBin = (Get-Command pixi-sandbox -ErrorAction Stop).Source
          foreach ($environment in ($env:ENVIRONMENTS -split ',')) {
            pixi install --frozen -e $environment.Trim()
          }
          $transport = Join-Path $env:RUNNER_TEMP 'pixi-sandbox-transport'
          Remove-Item -Recurse -Force $transport -ErrorAction SilentlyContinue
          $packArgs = @('pack', '--repo-root', '.', '--envs', $env:ENVIRONMENTS, '--output-dir', $transport, '--platform', $env:PLATFORM, '--fetch-tools', '--self-bin', $selfBin)
          if ($env:CARGO_VENDOR -eq 'true') { $packArgs += '--cargo-vendor' }
          & $selfBin @packArgs
          & $selfBin doctor --branch-location $transport --verify
          $bytes = [System.Text.Encoding]::UTF8.GetBytes("x-access-token:$env:PUSH_TOKEN")
          $basic = [System.Convert]::ToBase64String($bytes)
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          & $selfBin publish --input-dir $transport --branch-name $env:BRANCH --remote $env:REMOTE

  upgrade:
    name: upgrade
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.upgrade != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15 # local (edit 4)
    # A job-level `permissions:` block replaces, not adds to, the workflow-level one above
    # (the same trap `relock.yml` documents): `pull-requests: write` has to be named here
    # explicitly, alongside `contents: write`, or the `gh pr create` step below gets a 403.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # Never trust a package manager's "latest" for anything that ends up in a committed
      # file (decision-4 / D16): bootstrap the version already pinned above — checksum
      # verified — then ask that exact binary to self-update in place. Only the verified
      # result of that self-update, never a floating resolver, ever touches a generated file.
      # Kept as generated: unlike the publish bootstrap (pixi-sandbox#87), this one rewrites
      # the checksum line to an absolute path before `sha256sum --check`, so it works.
      - name: Download currently pinned pixi-sandbox
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          asset=pixi-sandbox-x86_64-unknown-linux-musl
          base="$GITHUB_SERVER_URL/Archont561/pixi-sandbox/releases/download/v${PIXI_SANDBOX_VERSION}"
          bin="$RUNNER_TEMP/pixi-sandbox"
          curl --fail --location --silent --show-error "$base/$asset" --output "$bin"
          curl --fail --location --silent --show-error "$base/SHA256SUMS" --output "$RUNNER_TEMP/SHA256SUMS"
          grep "  $asset$" "$RUNNER_TEMP/SHA256SUMS" | sed "s#  $asset\$#  $bin#" | sha256sum --check --status -
          chmod +x "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Self-update to the requested version
        id: self-update
        shell: bash
        env:
          BIN: ${{ steps.bootstrap.outputs.bin }}
          UPGRADE_VERSION: ${{ inputs.upgrade }}
        run: |
          set -euo pipefail
          if [ -n "$UPGRADE_VERSION" ]; then
            "$BIN" self-update --dest "$BIN" --version "$UPGRADE_VERSION"
          else
            "$BIN" self-update --dest "$BIN"
          fi
          echo "version=$("$BIN" --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Check the owned files against the updated binary
        id: check
        shell: bash
        env:
          BIN: ${{ steps.bootstrap.outputs.bin }}
        run: |
          if "$BIN" init --check \
            --github-workflow-path .github/workflows/publish-sandbox.yml \
            --relock-workflow-path .github/workflows/relock.yml \
            --relock-ci-workflow ci.yml \
            --script-path scripts/restore.sh \
            --config pixi-sandbox.toml \
            --branch sandbox/developer-linux-64; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the owned files
        if: steps.check.outputs.drift == 'true'
        shell: bash
        env:
          BIN: ${{ steps.bootstrap.outputs.bin }}
        run: |
          set -euo pipefail
          "$BIN" init \
            --github-workflow-path .github/workflows/publish-sandbox.yml \
            --relock-workflow-path .github/workflows/relock.yml \
            --relock-ci-workflow ci.yml \
            --script-path scripts/restore.sh \
            --config pixi-sandbox.toml \
            --branch sandbox/developer-linux-64

      # Config is reviewed data, never rewritten by `init` or this job (D16): only the three
      # owned paths are ever staged here, and a config the updated binary no longer understands
      # was already reported above, in prose, as a finding for a human to act on.
      # local: the proposed PR is `init` output, so it DROPS the LOCAL EDITS in this file's
      # header — reapply them during review (pixi-sandbox#79).
      - name: Open a pull request with the regenerated files
        if: steps.check.outputs.drift == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.self-update.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "pixi-sandbox[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="pixi-sandbox-upgrade/$VERSION"
          git checkout -B "$branch"
          git add .github/workflows/publish-sandbox.yml .github/workflows/relock.yml scripts/restore.sh
          if git diff --cached --quiet; then
            echo "::notice::init reported drift but left no staged changes; nothing to propose"
            exit 0
          fi
          git commit -m "chore(pixi-sandbox): upgrade generated files to $VERSION"
          git push --force origin "$branch"
          gh pr create \
            --title "chore(pixi-sandbox): upgrade generated files to $VERSION" \
            --body "Regenerated by the scheduled pixi-sandbox upgrade job. A \`github.token\` merge starts no \`on: push\` workflow, so after merging run: gh workflow run .github/workflows/publish-sandbox.yml --ref main. NOTE: init output drops this repo's LOCAL EDITS (see the header of publish-sandbox.yml) — reapply them before merging." \
            --base main \
            --head "$branch" \
            || echo "::notice::a pull request already exists for $branch"
