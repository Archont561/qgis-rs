# Generated by `pixi-sandbox init` (v0.4.3) — local policy edits follow.
#
# To regenerate after upgrading the pinned release:
#   git rm pixi-sandbox.toml .github/workflows/publish-sandbox.yml \
#          .github/workflows/relock.yml scripts/restore.sh scripts/restore.ps1
#   pixi global install --channel https://prefix.dev/archont561/pixi-sandbox \
#                       --channel conda-forge "pixi-sandbox==<version>"
#   pixi-sandbox init --project-root . --script-path scripts/restore.sh
# …then reapply the local edits marked "local" below.
#
# LOCAL EDITS (the generator does not produce these):
#   1. push-path filter, so only a sandbox-input change republishes;
#   2. least-privilege permissions: read at the top, write only on `publish`;
#   3. concurrency groups, so a rerun cannot race an in-flight publish;
#   4. `timeout-minutes` on both jobs;
#   5. `pixi-version` pinned on both setup-pixi steps, and its cache disabled
#      everywhere — pixi-sandbox owns the native `pixi install` invocation
#      while packing the checked-out project (see qgis-rs#9), so an action
#      cache keyed on the manifest could restore a solve pixi-sandbox is not
#      going to reuse (qgis-rs#12).
#
# v0.4.x replaced the v0.3.x composite `setup/`/`publish/` actions: the CLI is
# now installed with `pixi global install` and the packing step runs inline, so
# this file has no `Archont561/pixi-sandbox/*` action references left to pin.
# The packing step downloads the checksum-verified v0.4.3 release binary and
# uses *it* to pack, verify and publish — consumer workflows must not build
# pixi-sandbox from the checkout, which belongs to the consumer project.
name: publish sandbox

on:
  # Only a change to an actual input of the sandbox snapshot republishes; any
  # other push leaves the published branch alone. `workflow_run` cannot filter
  # by path, so this does not wait for CI; `workflow_dispatch` always publishes.
  push:
    branches: [main]
    paths:
      - "pixi-sandbox.toml"
      - "pixi.toml"
      - "pixi.lock"
      - "package.json"
      - "bun.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ts-packages/qgis-node/package.json"
      - "ts-packages/qgis-node/Cargo.toml"
      - "ts-packages/qgis-node/build.rs"
      - "ts-packages/qgis-node/package-scripts/**"
      - "ts-packages/test-utils/package.json"
      - "py-packages/qgis-rs/pyproject.toml"
      - "py-packages/qgis-sdk/pyproject.toml"
      - ".github/workflows/publish-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sandbox
  cancel-in-progress: false

env:
  PIXI_SANDBOX_VERSION: 0.4.3
  PIXI_SANDBOX_CHANNEL: https://prefix.dev/archont561/pixi-sandbox

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false
      - name: Install pixi-sandbox CLI
        shell: bash
        run: >-
          pixi global install
          --channel "$PIXI_SANDBOX_CHANNEL"
          --channel conda-forge
          "pixi-sandbox==${PIXI_SANDBOX_VERSION}"
      - id: plan
        shell: bash
        run: echo "matrix=$(pixi-sandbox plan --config pixi-sandbox.toml --json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    strategy:
      fail-fast: false
      # `include:` nested under `matrix:`, not `matrix:` itself. `plan --json` emits
      # {"schema":1,"include":[...]}, and Actions requires strategy.matrix to be an object.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: sandbox-publish-${{ github.repository }}-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only install the Pixi executable here. Cache-key generation must not
      # inspect the manifest: pixi-sandbox controls the native `pixi install`
      # while packing the checked-out project (see qgis-rs#9).
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false
      - name: Install pixi-sandbox CLI
        shell: bash
        run: >-
          pixi global install
          --channel "$PIXI_SANDBOX_CHANNEL"
          --channel conda-forge
          "pixi-sandbox==${PIXI_SANDBOX_VERSION}"

      # Consumer workflows embed the released, checksum-verified standalone binary. Building
      # from the checkout would incorrectly assume the consumer has pixi-sandbox's source tree
      # and its `package` environment; the checked-out tree belongs to the consumer project.
      - name: Download released pixi-sandbox
        id: bootstrap-unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux-64) asset=pixi-sandbox-x86_64-unknown-linux-musl ;;
            linux-aarch64) asset=pixi-sandbox-aarch64-unknown-linux-musl ;;
            osx-64) asset=pixi-sandbox-x86_64-apple-darwin ;;
            osx-arm64) asset=pixi-sandbox-aarch64-apple-darwin ;;
            *) echo "::error::unsupported release platform: ${{ matrix.platform }}"; exit 2 ;;
          esac
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v${PIXI_SANDBOX_VERSION}"
          path="$RUNNER_TEMP/$asset"
          curl --fail --location --silent --show-error "$base/$asset" --output "$path"
          curl --fail --location --silent --show-error "$base/SHA256SUMS" --output "$RUNNER_TEMP/SHA256SUMS"
          grep "  $asset$" "$RUNNER_TEMP/SHA256SUMS" | sha256sum --check --status -
          chmod +x "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Download released pixi-sandbox
        id: bootstrap-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = switch ('${{ matrix.platform }}') {
            'win-64' { 'pixi-sandbox-x86_64-pc-windows-msvc.exe' }
            default { throw "unsupported release platform: ${{ matrix.platform }}" }
          }
          $base = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/v$env:PIXI_SANDBOX_VERSION"
          $path = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -UseBasicParsing "$base/$asset" -OutFile $path
          Invoke-WebRequest -UseBasicParsing "$base/SHA256SUMS" -OutFile (Join-Path $env:RUNNER_TEMP 'SHA256SUMS')
          $expected = (Get-Content (Join-Path $env:RUNNER_TEMP 'SHA256SUMS') | Where-Object { $_ -match "  $([regex]::Escape($asset))$" }).Split()[0]
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.ToLowerInvariant()) { throw "SHA256 mismatch for $asset" }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Pack, verify, and publish
        if: runner.os != 'Windows'
        shell: bash
        env:
          ENVIRONMENTS: ${{ matrix.environments }}
          PLATFORM: ${{ matrix.platform }}
          BRANCH: ${{ matrix.branch }}
          CARGO_VENDOR: ${{ matrix.cargo_vendor }}
          SELF_BIN: ${{ steps.bootstrap-unix.outputs.path }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IFS=',' read -ra ENVS <<< "$ENVIRONMENTS"
          for ENVIRONMENT in "${ENVS[@]}"; do
            pixi install --frozen -e "${ENVIRONMENT//[[:space:]]/}"
          done
          TRANSPORT="$RUNNER_TEMP/pixi-sandbox-transport"
          rm -rf "$TRANSPORT"
          CARGO_VENDOR_ARG=
          if [ "$CARGO_VENDOR" = true ]; then CARGO_VENDOR_ARG=--cargo-vendor; fi
          "$SELF_BIN" pack \
            --repo-root . \
            --envs "$ENVIRONMENTS" \
            --output-dir "$TRANSPORT" \
            --platform "$PLATFORM" \
            --fetch-tools \
            --self-bin "$SELF_BIN" \
            $CARGO_VENDOR_ARG
          "$SELF_BIN" doctor --branch-location "$TRANSPORT" --verify
          BASIC_AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\r\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $BASIC_AUTH"
          "$SELF_BIN" publish --input-dir "$TRANSPORT" --branch-name "$BRANCH" --remote "$REMOTE"

      - name: Pack, verify, and publish
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ENVIRONMENTS: ${{ matrix.environments }}
          PLATFORM: ${{ matrix.platform }}
          BRANCH: ${{ matrix.branch }}
          CARGO_VENDOR: ${{ matrix.cargo_vendor }}
          SELF_BIN: ${{ steps.bootstrap-windows.outputs.path }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          PUSH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($environment in ($env:ENVIRONMENTS -split ',')) {
            pixi install --frozen -e $environment.Trim()
          }
          $transport = Join-Path $env:RUNNER_TEMP 'pixi-sandbox-transport'
          Remove-Item -Recurse -Force $transport -ErrorAction SilentlyContinue
          $packArgs = @('pack', '--repo-root', '.', '--envs', $env:ENVIRONMENTS, '--output-dir', $transport, '--platform', $env:PLATFORM, '--fetch-tools', '--self-bin', $env:SELF_BIN)
          if ($env:CARGO_VENDOR -eq 'true') { $packArgs += '--cargo-vendor' }
          & $env:SELF_BIN @packArgs
          & $env:SELF_BIN doctor --branch-location $transport --verify
          $bytes = [System.Text.Encoding]::UTF8.GetBytes("x-access-token:$env:PUSH_TOKEN")
          $basic = [System.Convert]::ToBase64String($bytes)
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          & $env:SELF_BIN publish --input-dir $transport --branch-name $env:BRANCH --remote $env:REMOTE
