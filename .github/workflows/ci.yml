# ci.yml — validate PRs: check pixi environments and run tests
#
# Runs on every PR to main. Validates:
# 1. Pixi environments are valid (dev + docs + utils)
# 2. The sandbox publish plan (.pixi-sandbox.toml) is valid
# 3. Rust code compiles and tests pass
# 4. Documentation site builds
#
# This workflow only validates. Publishing the docs site to GitHub Pages lives
# in pages.yml; publishing sandbox bundles lives in publish-sandbox.yml.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-pixi:
    name: Validate Pixi environments
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      - name: validate dev environment
        run: |
          pixi install -e dev
          pixi run -e dev cargo --version
          pixi run -e dev pixi --version
          pixi run -e dev clang-format --version

      - name: validate utils environment
        run: |
          pixi install -e utils
          pixi run -e utils actionlint --version
          pixi run -e utils taplo --version

      - name: validate docs environment
        run: |
          pixi install -e docs
          pixi run -e docs bun --version

      # Validate the reviewed publish plan (.pixi-sandbox.toml) exactly as the
      # publish-sandbox workflow will: checksum-verified release binary + plan.
      # Pinned SHA matches .github/workflows/publish-sandbox.yml `uses:` ref.
      - name: validate sandbox publish plan
        uses: Archont561/pixi-sandbox/.github/actions/setup-pixi-sandbox@3d7a61825c165c161d4e13df78ee589d0eafc2f1 # main @ 2026-09-23
        id: sandbox-setup
        with:
          repository: Archont561/pixi-sandbox
          version: v0.2.0
          token: ${{ github.token }}

      - name: check sandbox plan matrix
        run: |
          "${{ steps.sandbox-setup.outputs.path }}" plan --config .pixi-sandbox.toml --json

  test-rust:
    name: Test Rust code
    runs-on: ubuntu-latest
    needs: validate-pixi
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      - name: install environment
        run: pixi install -e dev

      - name: run tests
        run: pixi run -e dev cargo test --workspace

  # Mirrors the build half of pages.yml, so a PR catches a broken Pages
  # deployment before it can reach main.
  build-docs:
    name: Build documentation site
    runs-on: ubuntu-latest
    needs: validate-pixi
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      - name: install docs environment
        run: pixi install -e docs

      # apps/docs is a member of the root Bun workspace, so the frozen install
      # runs at the workspace root against the committed bun.lock.
      - name: install dependencies
        run: pixi run -e docs bun install --frozen-lockfile

      - name: build documentation
        working-directory: apps/docs
        run: pixi run -e docs bun run build

      - name: upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: apps/docs/dist/
          retention-days: 7
