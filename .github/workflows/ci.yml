# One required CI job runs the full Rust/QGIS gate, coverage, native package
# smoke tests, TypeScript bridge tests, and reusable sandbox-plan validation.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          # Must be the python QGIS is bundled with — the same value as
          # `python` in pixi.toml and `requires-python` in py-packages/*/pyproject.toml.
          python-version: "3.12"

      - name: Set up Rust with LLVM coverage tools
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install default environment
        run: pixi install -e default --locked

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      # maturin develop installs into an active virtual environment.
      - name: Create Python virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python test tools
        run: python -m pip install "maturin>=1.7,<2" "pytest>=8,<9" "pytest-cov>=5,<7"

      # The repository task is the single source of truth for Rust/C++
      # formatting and linting plus Rust unit/integration tests, including QGIS.
      - name: Run the full CI gate
        run: pixi run -e default ci-full

      # With the `python` Cargo feature disabled, PyO3 links to the interpreter
      # for Rust test binaries instead of leaving extension-module symbols open.
      - name: Generate Rust coverage report
        run: |
          mkdir -p target/coverage
          cargo llvm-cov \
            --workspace \
            --exclude qgis-sys \
            --no-default-features \
            --lcov \
            --output-path target/coverage/rust-lcov.info \
            -- --test-threads=1

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: target/coverage/rust-lcov.info
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and install qgis-rs
        working-directory: py-packages/qgis-rs
        run: maturin develop

      - name: Test qgis-rs Python API and FFI with coverage
        env:
          QGIS_REQUIRE_NATIVE: "1"
        run: |
          mkdir -p target/coverage
          python -m pytest py-packages/qgis-rs/tests -v \
            --cov=qgis_rs \
            --cov-report=term-missing \
            --cov-report=xml:target/coverage/python-qgis-rs.xml

      - name: Build and install qgis-sdk
        working-directory: py-packages/qgis-sdk
        run: maturin develop

      - name: Test qgis-sdk Python API and FFI with coverage
        env:
          QGIS_REQUIRE_NATIVE: "1"
        run: |
          python -m pytest py-packages/qgis-sdk/tests -v \
            --cov=qgis_sdk \
            --cov-report=term-missing \
            --cov-report=xml:target/coverage/python-qgis-sdk.xml

      # Every JS step below runs in the `bun` environment. Bun is not installed
      # in `default` and cannot be: conda-forge qgis needs icu >=78.3 while bun
      # needs icu >=75.1,<76, so the two never solve together. The Rust side of
      # the addon still builds because the `bun` environment carries the rust
      # toolchain that `napi build` shells out to.
      - name: Install the Bun environment from the root lockfile
        run: |
          pixi install -e bun --locked
          pixi run -e bun bun-install

      # `napi build` takes --cargo-cwd (not --manifest-path) in @napi-rs/cli
      # 2.x. The package script supplies the output directory positionally and
      # preserves the package's custom JS wrapper and declarations.
      - name: Build the native addon
        run: pixi run -e bun node-build

      - name: Test the native FFI
        run: pixi run -e bun node-test

      # Not `bun pm pack`: it always packs the root workspace (no --filter) and
      # the root package shares the member's name, so it would validate the
      # wrong package and still exit 0. See the pack-check task.
      - name: Check the npm publishable file set
        run: pixi run -e bun pack-check

      - name: Upload Python coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: target/coverage/python-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Run TypeScript bridge tests
        run: pixi run -e bun bun test ts-packages/qgis-sdk-bridge

      # `bridge-build` rather than `pixi run bun run build` with a
      # `working-directory:` above it: pixi runs tasks in the manifest's
      # directory, so the step's working-directory is ignored and the root
      # package.json's `bun run --filter '*' build` runs instead — every
      # workspace member, not just the bridge. The task carries its own cwd.
      - name: Build TypeScript bridge
        run: pixi run -e bun bridge-build

      # v0.3.2's published setup action is self-contained. The v0.3.1 shim
      # used an invalid relative `uses:` reference, fixed upstream in
      # pixi-sandbox#37.
      - name: Set up the pinned pixi-sandbox release binary
        uses: Archont561/pixi-sandbox/setup@da230c2db2dff8a242c40a89c3a4c66de7777518 # v0.3.2
        id: sandbox-setup
        with:
          version: v0.3.2
          token: ${{ github.token }}

      - name: Validate the reviewed publish plan
        run: '"${{ steps.sandbox-setup.outputs.path }}" plan --config .pixi-sandbox.toml --json'
