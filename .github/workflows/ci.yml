# One required CI job, and it runs one command: `pixi run ci`
# (scripts/ci.sh). Everything this workflow does besides that is toolchain
# setup and caching, which is the only thing a CI file should own — if a step
# here knew how to build or test something, the local gate and CI could
# disagree, and CI would be the only place you could find out.
#
# What this file deliberately does NOT do any more, and why:
#
#   * no actions/setup-python — pixi's `default` environment already carries
#     the interpreter QGIS was compiled against (3.12.*). A second interpreter
#     on PATH is how you get a wheel built for one ABI and imported by another.
#   * no dtolnay/rust-toolchain, no llvm-tools-preview — conda-forge's `rust`
#     ships cargo plus a version-matched llvm-profdata/llvm-cov pair in its
#     sysroot, which is everything cargo-llvm-cov shells out to.
#   * no `python -m venv` + `pip install maturin pytest pytest-cov` — the pixi
#     environment IS the target interpreter, maturin/pytest/pytest-cov are
#     declared in pixi.toml, and `maturin develop` accepts the CONDA_PREFIX
#     that environment exports. A venv layered on top would only hide QGIS's
#     own site-packages.
#   * no per-package `maturin develop` / `pytest` steps — the turbo `build`
#     task for each Python distribution builds *and* installs its wheel, and
#     `test`/`coverage` depend on it. CI used to recompile those crates a
#     second time after turbo had already built them.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fetch prebuilt registry indexes instead of cloning the whole crates.io git
  # index on a cold cache.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  # Cheap, independent, and therefore parallel: this needs neither the QGIS
  # environment nor the Bun workspace, so it reports a broken publish contract
  # in under a minute instead of waiting behind a 3-hour native build.
  sandbox-plan:
    name: Sandbox publish plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the pinned pixi-sandbox release binary
        uses: Archont561/pixi-sandbox/setup@da230c2db2dff8a242c40a89c3a4c66de7777518 # v0.3.2
        id: sandbox-setup
        with:
          version: v0.3.2
          token: ${{ github.token }}

      - name: Validate the reviewed publish plan
        run: '"${{ steps.sandbox-setup.outputs.path }}" plan --config .pixi-sandbox.toml --json'

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      # Environment cache keyed on the lockfile: a hit skips the heavy
      # QGIS/rust solve and download entirely. The exact sha in the key means a
      # partially written cache is never poisoned — actions/cache only saves on
      # a full key miss.
      - name: Cache the pixi environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pixi/envs
          key: pixi-envs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            pixi-envs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-
            pixi-envs-${{ runner.os }}-

      - name: Install the pixi environments
        run: pixi install --locked -e default -e bun

      # Registry downloads and build output, including qgis-sys's C++ compile.
      # Plain actions/cache rather than Swatinem/rust-cache: cargo lives inside
      # the pixi environment here, not on the runner's PATH, and rust-cache
      # shells out to it during setup.
      - name: Cache cargo and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-

      # Turbo's content-hash cache lets the gate skip packages whose inputs did
      # not change since the last run on this branch.
      - name: Cache the turborepo task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-

      # Bun cannot live in `default`: conda-forge qgis needs icu >=78.3 while
      # bun needs icu >=75.1,<76, so the two never solve together.
      - name: Install the Bun workspace from the root lockfile
        run: pixi run -e bun bun-install

      - name: Verify every manifest states the same version
        run: pixi run -e bun version-check

      # THE gate. Identical to what a contributor runs before pushing.
      # Produces target/coverage/{rust-lcov.info,python-*.xml} on the way.
      - name: Run the CI gate
        id: gate
        run: |
          set -o pipefail
          pixi run ci 2>&1 | tee gate.log

      # The full log is a click away in the UI, but a failure summary that
      # travels with the API (an annotation and the job summary) is what makes
      # a red run diagnosable from a terminal, a bot, or a phone.
      - name: Summarize the failure
        if: ${{ failure() && steps.gate.outcome == 'failure' }}
        run: |
          {
            echo '### CI gate failed'
            echo
            echo '```'
            tail -n 400 gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '::error title=CI gate failed::%s\n' \
            "$(tail -n 300 gate.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-log
          path: gate.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: ignore
          retention-days: 7

      # Tokenless on public repos; CODECOV_TOKEN covers private mirrors. A
      # Codecov outage must never turn a green gate red, so this stays
      # non-fatal.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: target/coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
