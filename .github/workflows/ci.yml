# The gate, fanned out across four lanes — and every lane runs one command:
# `pixi run xtask ci --stage <name>` (`crates/xtask`). Nothing in this file
# knows how to build or test anything, which is the only way the local gate and
# CI can be the same object (D10). The *split* is in xtask too: `Stage::steps`
# lists what each lane owns and `crates/xtask/tests/ci.rs` asserts the stages
# partition `GATE_STEPS`, so a lane cannot quietly stop running a step.
#
#   repo      seconds, no compiler — repo lints + the format-drift gate
#   lint      clippy and biome
#   test      the test fan-out and the publishable-package check
#   coverage  the instrumented rebuild; only on main, and it blocks nothing
#
# `repo` gates the two expensive lanes, so a formatting violation costs one
# minute instead of nine. `lint` and `test` run in parallel: that trades runner
# minutes for wall clock on purpose (TASK-46 records both numbers).
#
# What this file deliberately does NOT do, and why:
#
#   * no actions/setup-python — pixi's `default` environment already carries
#     the interpreter QGIS was compiled against (3.12.*). A second interpreter
#     on PATH is how you get a wheel built for one ABI and imported by another.
#   * no dtolnay/rust-toolchain, no llvm-tools-preview — conda-forge's `rust`
#     ships cargo plus a version-matched llvm-profdata/llvm-cov pair in its
#     sysroot, which is everything cargo-llvm-cov shells out to.
#   * no `python -m venv` + `pip install maturin pytest pytest-cov` — the pixi
#     environment IS the target interpreter, and those tools are declared in
#     pixi.toml.
#   * no cache key containing `github.sha` — that guaranteed a miss on every
#     run, a multi-GiB save on top of it, and eviction of the caches the next
#     run wanted. Keys are lockfile-only; see .github/actions/setup-workspace.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fetch prebuilt registry indexes instead of cloning the whole crates.io git
  # index on a cold cache.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  repo:
    name: repo lints and format
    runs-on: ubuntu-latest
    # Measured worst case for this lane is well under a minute; the timeout is
    # a stuck-runner guard, not a budget (it replaces a blanket 180).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No cargo cache: this lane runs rustfmt, taplo, actionlint, biome and
      # the in-process repo lints. None of them compiles a crate.
      - uses: ./.github/actions/setup-workspace
        with:
          cargo: "false"

      - name: Verify every manifest states the same version
        run: pixi run -e bun version-check

      - name: Repo lints and format drift
        id: gate
        run: |
          set -o pipefail
          pixi run xtask ci --stage repo 2>&1 | tee gate.log

      - name: Summarize the failure
        if: ${{ failure() && steps.gate.outcome == 'failure' }}
        run: pixi run xtask ci-failure-summary gate.log

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-log-repo
          path: gate.log
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: package lints
    needs: [repo]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Clippy writes its own fingerprints into `target/`; a separate suffix
      # keeps this lane and the test lane from invalidating each other.
      - uses: ./.github/actions/setup-workspace
        with:
          cache-suffix: lint

      - name: Package lints
        id: gate
        run: |
          set -o pipefail
          pixi run xtask ci --stage lint 2>&1 | tee gate.log

      - name: Summarize the failure
        if: ${{ failure() && steps.gate.outcome == 'failure' }}
        run: pixi run xtask ci-failure-summary gate.log

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-log-lint
          path: gate.log
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: tests
    needs: [repo]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          cache-suffix: test

      - name: Tests and package contents
        id: gate
        run: |
          set -o pipefail
          pixi run xtask ci --stage test 2>&1 | tee gate.log

      - name: Summarize the failure
        if: ${{ failure() && steps.gate.outcome == 'failure' }}
        run: pixi run xtask ci-failure-summary gate.log

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-log-test
          path: gate.log
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: coverage
    # Only where it is read. Coverage is an instrumented rebuild of everything
    # the test lane just built, and nothing gates on its result
    # (`fail_ci_if_error: false`), so paying for it on every pull-request push
    # bought a Codecov comment at the price of the slowest step in the gate.
    # It still runs on every merge to main, which is what the trend line is
    # drawn from, and `workflow_dispatch` covers "I want it on this branch".
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          cache-suffix: coverage

      - name: Coverage
        id: gate
        run: |
          set -o pipefail
          pixi run xtask ci --stage coverage 2>&1 | tee gate.log

      - name: Summarize the failure
        if: ${{ failure() && steps.gate.outcome == 'failure' }}
        run: pixi run xtask ci-failure-summary gate.log

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-log-coverage
          path: gate.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: ignore
          retention-days: 7

      # Tokenless on public repos; CODECOV_TOKEN covers private mirrors. A
      # Codecov outage must never turn a green gate red, so this stays
      # non-fatal.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/rust-lcov.info,target/coverage/python-qgis-sdk.xml,target/coverage/python-qgis-py.xml
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload native coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/native.xml
          flags: native
          name: native-manager
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # One name for branch protection to require, so adding or renaming a lane
  # never silently un-protects `main`: this job is red unless every lane that
  # ran is green, and `always()` means a skipped coverage lane is not a pass
  # smuggled in by a cancelled dependency.
  gate:
    name: CI
    if: ${{ always() }}
    needs: [repo, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every lane
        run: |
          set -euo pipefail
          printf 'repo=%s lint=%s test=%s\n' \
            '${{ needs.repo.result }}' \
            '${{ needs.lint.result }}' \
            '${{ needs.test.result }}'
          for result in '${{ needs.repo.result }}' '${{ needs.lint.result }}' '${{ needs.test.result }}'; do
            if [ "$result" != "success" ]; then
              echo "::error title=CI::a lane did not succeed"
              exit 1
            fi
          done
