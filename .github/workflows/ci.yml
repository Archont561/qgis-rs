# One required CI job. The gate itself is a single pixi task (`pixi run ci`)
# that sequences the repo lints and the turbo-fanned package gates; this
# workflow only sets up toolchains and caches (pixi environments, cargo,
# turborepo), then runs the coverage producers and uploads to Codecov.
# The same gate runs locally with `pixi run ci`.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs both environments (`default` for Rust/C++/QGIS, `bun` for
      # JS/turbo) and restores them from cache keyed on pixi.lock, so the
      # heavy QGIS solve only runs when the lockfile changes.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          environments: |
            default
            bun

      # Validate the independently-published sandbox contract before the full
      # native/QGIS suite. This exercises the pinned v0.3.2 release action and
      # its plan shape even when a later application-level test fails.
      - name: Set up the pinned pixi-sandbox release binary
        uses: Archont561/pixi-sandbox/setup@da230c2db2dff8a242c40a89c3a4c66de7777518 # v0.3.2
        id: sandbox-setup
        with:
          version: v0.3.2
          token: ${{ github.token }}

      - name: Validate the reviewed publish plan
        run: '"${{ steps.sandbox-setup.outputs.path }}" plan --config .pixi-sandbox.toml --json'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          # Must be the python QGIS is bundled with — the same value as
          # `python` in pixi.toml and `requires-python` in py-packages/*/pyproject.toml.
          python-version: "3.12"

      - name: Set up Rust with LLVM coverage tools
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      # Caches ~/.cargo (registry) and target/ (includes qgis-sys's C++
      # compile), keyed on Cargo.lock; restores shrink the cold build to
      # minutes.
      - name: Cache cargo and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      # Turbo's content-hash cache in .turbo/cache lets `pixi run ci` skip
      # packages whose inputs did not change between runs.
      - name: Cache the turborepo task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-

      # The Bun workspace still installs from the root lockfile (the bun pixi
      # environment itself arrived in the setup step above). Bun cannot live
      # in `default`: conda-forge qgis needs icu >=78.3 while bun needs
      # icu >=75.1,<76, so the two never solve together.
      - name: Install the Bun workspace from the root lockfile
        run: pixi run -e bun bun-install

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      # maturin develop installs into an active virtual environment.
      - name: Create Python virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python test tools
        run: python -m pip install "maturin>=1.7,<2" "pytest>=8,<9" "pytest-cov>=5,<7"

      # The whole gate: repo lints, turbo lint, format drift gate, every
      # package's tests (builds are pulled in transitively), pack:check.
      - name: Run the CI gate
        run: pixi run ci

      # With the `python` Cargo feature disabled, PyO3 links to the interpreter
      # for Rust test binaries instead of leaving extension-module symbols open.
      - name: Generate Rust coverage report
        run: |
          mkdir -p target/coverage
          cargo llvm-cov \
            --workspace \
            --exclude qgis-sys \
            --no-default-features \
            --lcov \
            --output-path target/coverage/rust-lcov.info \
            -- --test-threads=1

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: target/coverage/rust-lcov.info
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and install qgis-rs
        working-directory: py-packages/qgis-rs
        run: maturin develop

      - name: Test qgis-rs Python API and FFI with coverage
        env:
          QGIS_REQUIRE_NATIVE: "1"
        run: |
          mkdir -p target/coverage
          python -m pytest py-packages/qgis-rs/tests -v \
            --cov=qgis_rs \
            --cov-report=term-missing \
            --cov-report=xml:target/coverage/python-qgis-rs.xml

      - name: Build and install qgis-sdk
        working-directory: py-packages/qgis-sdk
        run: maturin develop

      - name: Test qgis-sdk Python API and FFI with coverage
        env:
          QGIS_REQUIRE_NATIVE: "1"
        run: |
          mkdir -p target/coverage
          python -m pytest py-packages/qgis-sdk/tests -v \
            --cov=qgis_sdk \
            --cov-report=term-missing \
            --cov-report=xml:target/coverage/python-qgis-sdk.xml

      - name: Upload Python coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: target/coverage/python-*.xml
          if-no-files-found: ignore
          retention-days: 7

      # Uploads the lcov + pytest XML reports. Works tokenless on public
      # repos; CODECOV_TOKEN covers private mirrors. A Codecov outage must
      # never turn a green gate red, so upload failures stay non-fatal.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/rust-lcov.info,target/coverage/python-qgis-rs.xml,target/coverage/python-qgis-sdk.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
