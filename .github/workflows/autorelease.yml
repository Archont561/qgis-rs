# prepare release
#
# A maintainer starts this manually. convco derives the next stable SemVer from
# the conventional commits since the latest v* tag, scripts/release/prepare.sh
# writes that number into every manifest and regenerates CHANGELOG.md from the
# same history, and this workflow commits the result to main and creates the
# tag that release.yml consumes.
#
# The split is the point: nothing is published as a side effect of merging, and
# a release is an explicit, immutable tag.
name: prepare release

on:
  workflow_dispatch:

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: derive version, changelog, and tag
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      # Always release current main, even if the dispatch UI was opened from
      # another branch. Full history and tags are inputs to convco.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      - name: Cache the pixi environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pixi/envs
          key: pixi-envs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            pixi-envs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-
            pixi-envs-${{ runner.os }}-

      - name: Install the pixi environments
        run: pixi install --locked -e default -e bun

      - name: Derive the version, rewrite the manifests, regenerate the changelog
        id: version
        run: |
          next="$(bash scripts/release/prepare.sh | tail -1)"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Convco selected v${next} from the conventional commit history."

      - name: Commit and tag the release
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${NEXT_VERSION}"
          git tag -a "v${NEXT_VERSION}" -m "qgis-rs v${NEXT_VERSION}"

          # Push the commit FIRST. Only a release commit main accepted may
          # acquire the tag that triggers publication, so a branch-protection
          # rejection cannot leave a publishable tag on an unmerged commit.
          git push origin HEAD:main
          git push origin "v${NEXT_VERSION}"
