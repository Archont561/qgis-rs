name: Node package

on:
  pull_request:
    branches: [main]
    paths:
      - "ts-packages/qgis-node/**"
      - "crates/qgis-node/**"
      - "crates/qgis-render/**"
      - "crates/qgis-cli/**"
      - ".github/workflows/node.yml"
  push:
    branches: [main]
    tags: ["v*", "qgis-node-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-node:
    name: Test Node.js bindings (fallback + native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps and test fallback
        working-directory: ts-packages/qgis-node
        run: |
          npm install
          npm test
          node ../../examples/typescript_api.js
      - name: Build NAPI addon
        working-directory: ts-packages/qgis-node
        run: |
          npx napi build --platform --release --manifest-path ../../crates/qgis-node/Cargo.toml -o .
          npm test
          node -e "const { TilePlan, Extent, ZoomRange } = require('./index.js'); console.log(new TilePlan(Extent.parse('14,50,15,51'), ZoomRange.parse('10-14')).tileCount())"

  build-npm:
    name: Build npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        working-directory: ts-packages/qgis-node
        run: |
          npm install
          npx napi build --platform --release --manifest-path ../../crates/qgis-node/Cargo.toml -o .
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ts-packages/qgis-node/*.tgz
