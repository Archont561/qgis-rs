# env.yml — pack the qgis-rs development environment and publish to env/qgis-rs-linux-64.
#
# Uses Archont561/pixi-sandbox to create a self-extracting bundle containing
# pixi + the conda-forge environment (QGIS, Rust, clang-tools, etc.).
# The bundle is published to the orphan branch env/qgis-rs-linux-64,
# which sandboxes can clone to bootstrap without network access to
# conda-forge, prefix.dev, or static.rust-lang.org.
#
# Consumer flow:
#   git clone --depth 1 --branch env/qgis-rs-linux-64 \
#     https://github.com/Archont561/qgis-rs pack
#   cd pack && bash ./pixi-sandbox-*.sh
#   . scripts/use-pack.sh
#   cargo --version && pixi --version
#
# See .knowledge/env-provisioning.md for the full design.

name: env

on:
  push:
    branches: [main]
    paths:
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/env.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PIXI_SANDBOX_PLATFORM: linux-64

jobs:
  pack:
    name: pack environment
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push env/qgis-rs-linux-64

    concurrency:
      group: env-qgis-rs-linux-64
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false
          cache-write: false

      # No --locked, matching the reference project's CI: pixi re-solves when
      # pixi.toml and pixi.lock disagree, so a manifest edit can never turn this
      # job red on its own — `sh scripts/pack-env.sh` and `pixi lock` are the
      # places the lock is actually checked in.
      - name: install pixi environment
        run: pixi install -e default

      # scripts/pack-env.sh is the single implementation behind `pixi run pack`,
      # so the bundle CI publishes is byte-for-byte what a local `pixi run pack`
      # produces — including the smoke test, which unpacks with the extractor's
      # real flags (-o/--output-directory, -e/--env-name).
      - name: pack environment and smoke test the bundle
        run: pixi run -e default pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qgis-rs-env-linux-64
          path: dist/
          retention-days: 30

      - name: publish env/qgis-rs-linux-64
        if: github.ref_name == 'main'
        run: sh scripts/publish-env-branch.sh qgis-rs-linux-64 dist
