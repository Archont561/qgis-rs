[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qgis-sdk"
version = "0.1.0"
description = "Python SDK for building QGIS plugins on top of PyQGIS"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
keywords = ["qgis", "gis", "plugin", "pyqgis"]

# No PyPI dependencies on purpose. Everything the SDK needs at runtime
# (Python, PyQGIS, Qt) comes from the conda-forge `qgis` package declared in
# pixi.toml [package.run-dependencies]. Keeping this list empty stops
# pixi-build-python's PyPI→conda mapping from pulling a second copy of
# anything into the environment.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
