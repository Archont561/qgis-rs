[package]
name = "qgis-node"
description = "Node.js / TypeScript bindings and CLI for qgis-rs — native-speed QGIS rendering, tiling, and plugin tools"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["qgis", "gis", "rendering", "tiles", "napi", "cli", "typescript"]
categories = ["science::geo", "api-bindings"]

[lib]
name = "qgis_node"
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "qgis-cli"
path = "src/bin/qgis-cli.rs"

[[bin]]
name = "qgis-plugin"
path = "src/bin/qgis-plugin.rs"

[dependencies]
qgis-render = { workspace = true }
qgis-server = { workspace = true }
qgis-cli = { workspace = true }
qgis-sdk = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

napi = { version = "2.16", features = ["napi4"] }
napi-derive = "2.16"

[build-dependencies]
napi-build = "2.1"

[features]
default = []
