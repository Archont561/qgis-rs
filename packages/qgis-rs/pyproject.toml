[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "qgis-rs"
version = "0.1.0"
description = "Python bindings and CLI for qgis-rs — native-speed QGIS rendering, tiling, and server tools"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
keywords = ["qgis", "gis", "rendering", "tiles", "cli", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/Archont561/qgis-rs"
Repository = "https://github.com/Archont561/qgis-rs"
Issues = "https://github.com/Archont561/qgis-rs/issues"
Documentation = "https://archont561.github.io/qgis-rs/"

[project.scripts]
qgis-cli = "qgis_rs.cli:main"
qgis-rs = "qgis_rs.cli:main"

[tool.maturin]
features = ["pyo3/extension-module", "python"]
manifest-path = "Cargo.toml"
module-name = "qgis_rs._core"
python-source = "python"
bindings = "pyo3"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests", "python"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.maturin.include]
# Include the Rust binary in the wheel as well — maturin will install it
# to PATH alongside the Python package.
