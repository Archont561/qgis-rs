# crates/qgis-engine — the dispatcher behind the one FFI function.
#
# `invoke(&str) -> String` is everything a language binding needs: py-packages/qgis-py/src-rust
# and ts-packages/qgis-node/src-rust are ~30 lines each because of it. Operations are added
# here and in qgis-protocol, never in a binding.

[package]
name = "qgis-engine"
description = "Operation dispatch for the versioned qgis-rs transport"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["qgis", "gis", "ffi", "engine", "json"]
categories = ["science::geo", "api-bindings"]

[features]
default = ["qgis"]
qgis = ["dep:qgis-sys", "qgis-sys/qgis"]

[dependencies]
qgis-sys = { workspace = true, optional = true, default-features = false }
qgis-protocol = { workspace = true }
qgis-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
