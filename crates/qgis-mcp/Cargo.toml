[package]
name        = "qgis-mcp"
description = "Model Context Protocol server exposing the qgis-rs engine as tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["qgis"]
qgis = ["qgis-sys/qgis"]

[dependencies]
qgis-render = { workspace = true }
qgis-sys = { workspace = true, default-features = false }
rmcp        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
schemars    = { workspace = true }
anyhow      = { workspace = true }
