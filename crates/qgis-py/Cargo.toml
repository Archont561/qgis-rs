# crates/qgis-py — the Rust core of the `qgis-rs` Python distribution.
#
# Builds the PyO3 extension module, imported by Python as `qgis_rs._core`
# (built by maturin, driven from ../../py-packages/qgis-rs/pyproject.toml).
#
# The lib target is ~40 lines: it forwards one JSON string to `qgis-engine` and
# hands one back (D09). The ergonomic Python API, the tests, the conda recipe
# and the pixi `[package]` manifest live in ../../py-packages/qgis-rs/.
#
# This crate deliberately has NO [[bin]] targets. It used to declare a
# `qgis-cli` wrapper bin, but bin names must be unique across the whole
# workspace — every bin resolves to the same target/<profile>/<name>, so the
# wrapper silently overwrote the real binary from crates/qgis-cli (whichever
# crate linked last won), including the one crates/qgis-cli's own
# CARGO_BIN_EXE tests execute. maturin's `pyo3` bindings never shipped the
# bin in the wheel anyway: the wheel's `qgis-cli` on PATH is the
# [project.scripts] console script `qgis_rs.cli:main`, which drives the same
# engine in-process.

[package]
name = "qgis-py"
description = "PyO3 extension module behind the `qgis-rs` Python package"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["qgis", "gis", "rendering", "tiles", "pyo3", "cli"]
categories = ["science::geo", "api-bindings"]

[lib]
# Import name inside the wheel: `qgis_rs._core` (see [tool.maturin] in the
# Python package's pyproject.toml) — the #[pymodule] fn in src/lib.rs is what
# produces PyInit__core, so the artifact name here is free to be unique. It
# MUST be: crates/qgis-sdk used to share `name = "_core"`, and both cdylibs
# then resolved to the same target/debug/lib_core.so, silently overwriting
# each other on every `maturin develop` and installing the wrong extension.
name = "qgis_rs_core"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# The extension module needs nothing but the engine: no domain crate, no serde,
# no error type (D09).
qgis-engine = { workspace = true }

pyo3 = { version = "0.22" }

[features]
default = ["python", "qgis"]
python = ["pyo3/extension-module"]
qgis = ["qgis-engine/qgis"]
