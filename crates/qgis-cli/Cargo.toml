[package]
name        = "qgis-cli"
description = "Command-line interface for qgis-rs: render, tiles, batch, info, serve, export, mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "qgis_cli"
path = "src/lib.rs"

[[bin]]
name = "qgis-cli"
path = "src/main.rs"

[dependencies]
qgis-render = { workspace = true }
qgis-engine = { workspace = true }
qgis-server = { workspace = true }
anyhow      = { workspace = true }
clap        = { workspace = true }
serde_json  = { workspace = true }

# The MCP server, bundled into the binary so `qgis-cli mcp` needs nothing else.
qgis-mcp = { workspace = true, optional = true, default-features = false }
tokio    = { workspace = true, optional = true }

[features]
default = ["mcp", "qgis"]
mcp     = ["dep:qgis-mcp", "dep:tokio"]
qgis    = ["dep:qgis-mcp", "qgis-mcp/qgis", "qgis-engine/qgis"]

[dev-dependencies]
# The `plan tiles` report is asserted to be byte-identical to what the MCP tool
# answers, which is what stops a second spelling of the same plan appearing.
qgis-mcp = { workspace = true, default-features = false }
rstest   = { workspace = true }
