# crates/qgis-node — the Rust core of the `qgis-rs` npm package.
#
# Builds the NAPI addon plus the `qgis-cli` / `qgis-plugin` binaries that the
# npm package shells out to. The addon is ~20 lines: it forwards one JSON string
# to `qgis-engine` and hands one back (D09). The JS side — package.json,
# index.js, the .d.ts and the CLI wrappers — lives in
# ../../ts-packages/qgis-node/, and drives this crate with:
#
#   napi build --platform --release \
#     --cargo-cwd ../../crates/qgis-node .
#
# The positional destination `.` puts the compiled .node file next to the
# package.json, so npm users never see this directory.

[package]
name = "qgis-node"
description = "NAPI addon and CLI binaries behind the `qgis-rs` npm package"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["qgis", "gis", "rendering", "tiles", "napi", "cli", "typescript"]
categories = ["science::geo", "api-bindings"]

[lib]
name = "qgis_node"
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "qgis-cli"
path = "src/bin/qgis-cli.rs"

[[bin]]
name = "qgis-plugin"
path = "src/bin/qgis-plugin.rs"

[dependencies]
# The addon needs nothing but the engine; `clap` and `qgis-cli` belong to the
# two binary targets above.
qgis-engine = { workspace = true }
qgis-cli = { workspace = true }
clap = { workspace = true }

napi = { version = "2.16", features = ["napi4"] }
napi-derive = "2.16"

[build-dependencies]
napi-build = "2.1"

[features]
default = []
