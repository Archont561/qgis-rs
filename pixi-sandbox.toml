schema = 1
branch_prefix = "sandbox"
cargo_vendor = true

[[bundle]]
name = "developer"
# `bun` is packed alongside `default` on purpose: every JS task in pixi.toml
# resolves its environment to `bun`, so a transport carrying only `default`
# could not build the napi addon, the docs app or the bridge suites. Both
# environments are QGIS-free of each other's icu pin by construction — see the
# header of pixi.toml.
environments = ["default", "bun"]
platforms = ["linux-64"]
