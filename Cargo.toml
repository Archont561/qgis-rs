[workspace]
resolver = "2"
members = ["crates/*", "packages/qgis-rs", "packages/qgis-sdk", "packages/qgis-node"]

[workspace.package]
version  = "0.1.0"
edition  = "2021"
license  = "GPL-2.0-or-later"

[workspace.dependencies]
cxx = "1.0.194"
cxx-build = "1.0.194"
anyhow = "1"
serde_json = "1"
walkdir = "2"
xshell = "0.2"
cc = "1.2.65"
thiserror = "2.0.18"
qgis-sys = { path = "crates/qgis-sys" }

# ── ecosystem crates ──────────────────────────────────────────────────────────
qgis-render = { path = "crates/qgis-render" }
qgis-server = { path = "crates/qgis-server" }
qgis-mcp    = { path = "crates/qgis-mcp" }
qgis-cli    = { path = "crates/qgis-cli" }
qgis-rs     = { path = "packages/qgis-rs" }
qgis-sdk    = { path = "packages/qgis-sdk" }
qgis-node   = { path = "packages/qgis-node" }

# ── python / node ───────────────────────────────────────────────────────────
pyo3 = { version = "0.22" }
napi = { version = "2.16", features = ["napi4"] }
napi-derive = "2.16"

# ── third-party ───────────────────────────────────────────────────────────────
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# rmcp is the official Model Context Protocol Rust SDK. `transport-io` is the
# stdio transport, `macros` provides #[tool_router]/#[tool], and `schemars`
# generates the JSON Schema each tool advertises as its input schema.
rmcp = { version = "3.4", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-std", "macros", "signal"] }
