# Every Rust crate lives under crates/ — including the language-binding crates
# (qgis-py, qgis-sdk, qgis-node), whose *packaging* lives in py-packages/ and
# ts-packages/. Those directories hold no Cargo manifests: a pyproject.toml or
# package.json points back here with manifest-path, so one `cargo check
# --workspace` covers the whole tree and one wheel build owns the Python side.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version  = "0.1.0"
edition  = "2021"
license  = "GPL-2.0-or-later"

[workspace.dependencies]
anyhow = "1"
serde_json = "1"
walkdir = "2"
xshell = "0.2"
cc = "1.2.65"
thiserror = "2.0.18"
# Internal crates carry BOTH a path and a registry version: cargo uses the path
# for workspace builds and substitutes the version when packaging for
# crates.io, so a release that bumps the workspace without bumping these would
# publish crates that ask the registry for their previous selves.
# `pixi run version-check` keeps them on the workspace version.
qgis-sys = { version = "0.1.0", path = "crates/qgis-sys", default-features = false }

# ── ecosystem crates ──────────────────────────────────────────────────────────
# The transport pair: `qgis-protocol` is the envelope, `qgis-engine` is the one
# function every language binding calls. See
# .knowledge/decisions/D09-wire-protocol-over-ffi.md.
qgis-protocol = { version = "0.1.0", path = "crates/qgis-protocol" }
qgis-engine = { version = "0.1.0", path = "crates/qgis-engine", default-features = false }
qgis-render = { version = "0.1.0", path = "crates/qgis-render" }
qgis-server = { version = "0.1.0", path = "crates/qgis-server" }
qgis-mcp    = { version = "0.1.0", path = "crates/qgis-mcp", default-features = false }
qgis-cli    = { version = "0.1.0", path = "crates/qgis-cli" }
qgis-sdk-core = { version = "0.1.0", path = "crates/qgis-sdk-core" }
qgis-py     = { version = "0.1.0", path = "crates/qgis-py" }
qgis-sdk    = { version = "0.1.0", path = "crates/qgis-sdk" }
qgis-node   = { version = "0.1.0", path = "crates/qgis-node" }
qgis-styles = { version = "0.1.0", path = "crates/qgis-styles" }

# ── python / node ───────────────────────────────────────────────────────────
pyo3 = { version = "0.22" }
napi = { version = "2.16", features = ["napi4"] }
napi-derive = "2.16"

# ── third-party ───────────────────────────────────────────────────────────────
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# rmcp is the official Model Context Protocol Rust SDK. `transport-io` is the
# stdio transport, `macros` provides #[tool_router]/#[tool], and `schemars`
# generates the JSON Schema each tool advertises as its input schema.
rmcp = { version = "3.4", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-std", "macros", "signal"] }

# ── test tooling ──────────────────────────────────────────────────────────────
# Dev-dependencies of the crates in `tests/` (D11: no `#[cfg(test)] mod tests` in
# `src/`), declared here so every crate pins one version:
#   rstest    #[case] / #[rstest] fixtures and matrix tests, `#[timeout]`
#   proptest  shrinking property tests, the Rust counterpart of hypothesis and
#             rapidcheck
rstest = "0.27"
proptest = "1.11"
