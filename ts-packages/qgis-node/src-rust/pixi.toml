# ts-packages/qgis-node/src-rust/pixi.toml — the Rust core of the `@archont561/qgis-node` npm package.
#
# The JS half (package.json, src/) is ts-packages/qgis-node/.

[package]
name = "qgis-node"
version = "0.1.0"
description = "TypeScript/JS bindings and CLI for qgis-rs — native-speed QGIS rendering, tiling, and plugin tools"
license = "GPL-2.0-or-later"

[package.build.backend]
name = "pixi-build-rust"
version = "*"
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]

[package.host-dependencies]
# `napi build` drives cargo, so rust is the only thing the build needs.
rust = ">=1.96.0,<1.97"

[package.run-dependencies]
# Deliberately empty of any JavaScript runtime. The addon is published to npm
# and declares `"engines": { "node": ">= 18" }` for its consumers; the build and
# test toolchain in this repository is bun, and neither belongs in a package's
# run dependencies. Consumers bring their own runtime.

[package.build.config]
# Build Rust NAPI addon + binaries
targets = ["x86_64-unknown-linux-gnu"]
