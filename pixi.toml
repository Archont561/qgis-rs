# qgis-rs — THE workspace manifest.
#
# Every Rust crate is a member of the Cargo workspace at the repository root
# (`crates/*`); the language distributions are packaging-only trees that point
# back into it:
#
#   py-packages/<dist>   maturin project: pyproject.toml + python sources + tests
#   ts-packages/<dist>   Bun/npm project: package.json + JS/TS sources + tests
#   crates/<crate>       Rust: the engine crates and the PyO3 / NAPI cores
#
# TWO environments, and the split between them is forced by conda-forge:
#
#   default  QGIS + Rust + C++ toolchain + Python + the packaged Python
#            distributions (qgis-rs, qgis-sdk) + lint tooling + the cargo test
#            tooling (cargo-llvm-cov / nextest / deny). Everything that touches
#            QGIS lives here, and this is what pixi-sandbox packs into the
#            published offline branch.
#   bun      Bun, for docs/ (Astro Starlight), the JS test suites, and the
#            napi addon build.
#
# WHY BUN CANNOT JOIN `default` — do not "simplify" this back into one
# environment without re-reading the constraint. The two runtimes need disjoint
# icu majors, verified by solving against conda-forge:
#
#   qgis 3.44.9 | 3.44.11 | 3.44.14   requires  icu >=78.3,<79.0a0
#   bun  1.3.7  | 1.3.9  | 1.3.10 | 1.3.11  requires  icu >=75.1,<76.0a0
#
# There is no icu that satisfies both, so a single environment carrying QGIS and
# bun does not solve. `bun` is the only thing in `bun`; the Rust toolchain is
# there too because `napi build` shells out to `cargo` (it runs `cargo metadata`
# before it runs anything else, and fails with `cargo: Permission denied`
# without it on PATH). The napi chain is QGIS-free — neither qgis-node nor
# qgis-render / qgis-server / qgis-cli depends on qgis-sys — so the `bun`
# environment never has to reach for QGIS and the icu conflict cannot reappear.
#
# Node.js is not installed anywhere. The napi addon is built and loaded with bun
# (`pixi run bun run build`), which is verified to work, though upstream napi-rs
# calls bun addon support best-effort. The published npm package still declares
# `"engines": { "node": ">= 18" }` — that describes the addon's runtime for
# consumers, not the build CLI, so it is deliberately kept.
# See .knowledge/decisions/D08-icu-split-and-bun-toolchain.md.
#
# NOTE (pixi 0.81): `default-environment` is only accepted on tasks that have a
# `cmd`, declared inline in `[tasks]`.
#
# Pins (verified 2026-09-18): rust 1.96.x, QGIS >=3.44.9, clang-tools 22.x,
# pixi-pack 0.7.x (conda-forge). Adding a pin means one `pixi lock` to refresh
# pixi.lock — CI's `--locked` installs fail until that lands.
# `pixi-build` is a PREVIEW feature — the `[package]` table shape may change
# between pixi minors, so `requires-pixi` and the workflows' pixi-version move
# together. Python is deliberately NOT declared as a dependency of the QGIS
# environments: the conda-forge `qgis` package pulls in the interpreter its
# PyQGIS bindings were built against, and a separate pin could only drift. The
# one exception is `py-runtime`, which declares the workspace range so the
# interpreter is guaranteed present. That range is capped at <3.14 because
# PyO3 0.22 refuses anything newer — see the feature for the full story.
# See .knowledge/pixi.md.

[workspace]
name = "qgis-rs"
# THE release version. Every other manifest in the repository restates or
# inherits this number and is checked against it by `pixi run version-check`
# (scripts/version.ts), which the CI gate runs. Bump it with
# `pixi run version-set X.Y.Z`, never by hand.
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]
# Enables the `[package]` section used by py-packages/qgis-sdk, which the workspace
# pulls in as a source dependency. Still a preview feature upstream:
# https://pixi.prefix.dev/latest/build/workspace/
preview = ["pixi-build"]
requires-pixi = ">=0.79.0"

# One place to bump a version; the tables below opt in with { workspace = true }.
[workspace.dependencies]
rust = ">=1.96.0,<1.97"
qgis = ">=3.44.9,<4"
maturin = ">=1.7,<2"
patchelf = "*"
pytest = ">=8,<9"
pytest-cov = ">=5,<7"
# The Python the project runs on is the Python QGIS is bundled with — not an
# independently chosen version. conda-forge ships qgis as per-ABI builds, and
# its PyQGIS bindings only import under the exact interpreter they were compiled
# against, so a project on any other python is a broken QGIS project.
#
# `3.12.*` is therefore not a preference: it tracks the `py312` qgis build
# (qgis 3.44.14-py312h7fa5fc2_1 -> python_abi 3.12 -> python 3.12.14). Pin it
# this tightly on purpose — a range would let the solver drift onto a different
# ABI, which fails at `import qgis`, not at solve time.
#
# To move Python, change all of these together or the build breaks in a place
# that does not name the cause:
#   1. this pin;
#   2. requires-python in py-packages/qgis-py/pyproject.toml and
#      py-packages/qgis-sdk/pyproject.toml;
#   3. python = "3.12.*" in py-packages/qgis-py/pixi.toml;
#   4. python-version in .github/workflows/ci.yml;
#   5. then `pixi lock`, and expect PyO3 0.22 to block anything past 3.13.
python = "3.12.*"
bun = ">=1.2.0,<2"

# ── feature layers ────────────────────────────────────────────────────────────
# The root `[dependencies]` table is intentionally empty; every dependency lives
# in a feature so each environment installs only what it needs.

[feature.rust.dependencies]
rust = { workspace = true }

[feature.cxx.dependencies]
cxx-compiler = ">=1.11.0,<2"
clang-tools = ">=22.1.8,<23"
# The generator and the build tool, so a CMakeLists.txt in this repository (or
# in a shim added later) needs nothing from outside the environment. `cxx-build`
# drives `cc` directly and does not use either, which is why they are pinned
# but not required by anything today.
cmake = ">=4.4,<5"
ninja = ">=1.13,<2"

[feature.cpp-test.dependencies]
# C++ test frameworks, deliberately NOT part of [feature.cxx] for the same
# reason the Rust cargo subcommands sit in [feature.rust-tools]: a framework is
# not a toolchain. Kept out of the `bun` environment's transitive set — it is
# not in any feature it pulls.
gtest = ">=1.18,<2"
# rapidcheck is RapidCheck: property-based testing in C++. It is to gtest what
# proptest is to the Rust test harness, and what hypothesis is to pytest.
rapidcheck = ">=2023.4,<2024"
# gcovr renders the GCC gcov profiles (gcov --json-format) into the C++ coverage
# report TASK-50 measures the native manager with. LLVM-instrumented coverage is
# unavailable in this environment (clang-tools ships no clang/clang++ drivers),
# so the GCC + gcovr route is the one. Declared like TASK-24's cmake/ninja: the
# sandbox cannot reach conda-forge, so the lock is refreshed runner-side by the
# relock bot (the guard detects the drift on the PR, the bot commits pixi.lock).
gcovr = ">=8,<9"

[feature.rust-tools.dependencies]
# Rust test/lint tooling that used to be `cargo install`-ed next to pixi (CI
# installed cargo-llvm-cov this way) or assumed to be on the developer's PATH.
# They are ordinary cargo subcommands with no build-time QGIS involvement, so
# conda-forge ships them and pixi owns them like everything else.
#
# Deliberately NOT part of [feature.rust]: that feature is also pulled into the
# `bun` environment (napi build shells out to cargo), and both environments are
# packed by the `developer` bundle in pixi-sandbox.toml. Keeping these here makes
# them `default`-only and keeps them out of the published transport.
#
# Lower bounds track the versions the tools were adopted at — the repo pins the
# bottom of each range and lets the solver float within the minor, so a
# `pixi lock` picks up patch and minor fixes without a manifest edit.
#
# NOTE on coverage: these are the cargo-* drivers only, but that is enough.
# cargo-llvm-cov shells out to llvm-profdata / llvm-cov, which it finds through
# `rustc --print sysroot` — and conda-forge's `rust` package ships a
# version-matched pair there, so coverage is self-contained inside `pixi run
# -e default` with no rustup `llvm-tools-preview` component involved
# (verified on rust 1.96.1: llvm 22.1.2-rust-1.96.1-stable, under
# $CONDA_PREFIX/lib/rustlib/x86_64-unknown-linux-gnu/bin/). That is why
# .github/workflows/ci.yml no longer `cargo install`s cargo-llvm-cov.
cargo-llvm-cov = ">=0.9.1,<0.10"
cargo-nextest = ">=0.9.146,<0.10"
cargo-deny = ">=0.20.2,<0.21"

[feature.qgis.dependencies]
qgis = { workspace = true }

[feature.py-runtime.dependencies]
# The interpreter plus the tooling needed to develop and test the two Python
# distributions (py-packages/qgis-py, py-packages/qgis-sdk) inside the QGIS
# environment.
#
# `python` is the version QGIS is bundled with (see [workspace.dependencies] for
# the full coupling and the list of places that must move together). Declaring
# it here is not overriding QGIS — it is stating the same fact twice, so a
# mismatch between the two is a solve error rather than an `import qgis` failure.
#
# The two distributions are deliberately NOT environment dependencies here.
# They are `[package]` sources built by `pixi-build-python`, and that backend
# drags the solve onto python 3.14 — which PyO3 0.22 refuses outright ("the
# configured Python interpreter version (3.14) is newer than PyO3's maximum
# supported version (3.13)"). The failure is invisible to the solver because
# PyO3's ceiling is not a conda dependency, so `pixi install` fails minutes
# later inside maturin. They are instead developed in place with `maturin
# develop`, which is exactly what CI does; see [feature.py.tasks] and
# [feature.sdk.tasks].
python = { workspace = true }
maturin = { workspace = true }
# Linux wheel builds copy QGIS/Qt shared libraries and rewrite their runtime
# paths; maturin shells out to patchelf for that packaging step.
patchelf = { workspace = true }
# `maturin develop` shells out to `pip --version` before it does anything else
# ("Failed to find pip (if working with a uv venv try `maturin develop --uv`)").
# The pixi-build-python path never needed it, because it installed the built
# wheel itself; developing in place does.
pip = ">=24,<27"
pytest = { workspace = true }
# The plugin CI exercises through --cov; declared so the distribution's own
# `coverage` package script can run it without a pip install.
pytest-cov = { workspace = true }
# Property-based testing for the Python distributions, next to pytest the way
# proptest sits next to the Rust harness. Not a runtime dependency of either
# distribution — it ships with the environment, not in the wheel.
hypothesis = ">=6.168,<7"

# The qgis-sdk CLI runtime (D15): typer builds the command tree and questionary
# asks for the names of UI scaffolds. Both are pypi packages, so they resolve
# from pypi and do not widen the conda solve. The wheel declares the same two.
[feature.py-runtime.pypi-dependencies]
typer = ">=0.27,<1"
questionary = ">=2.1,<3"

[feature.py-runtime.activation.env]
# The conda-forge `qgis` package already exports these through
# etc/conda/activate.d/qgis-activate.sh, which pixi runs for `pixi run` and
# `pixi shell`. They are repeated here so `import qgis` does not depend on
# remembering that, and so the paths are visible in the manifest. This moved
# here from [feature.sdk.activation] when the environments were consolidated:
# the QGIS environment is the only place a Python distribution is exercised.
# ($VAR syntax: activation runs under bash; platforms are linux-64 only.)
PYTHONPATH = "$CONDA_PREFIX/share/qgis/python/plugins:$CONDA_PREFIX/share/qgis/python:$PYTHONPATH"
QGIS_PREFIX_PATH = "$CONDA_PREFIX"
# The one QGIS variable conda's activate script does NOT export, and the reason
# `cargo test` used to need two separate invocations: without the plugin path a
# QgsApplication initialised in a test cannot load the bundled plugins, so
# qgis-sys's QGIS-backed suites failed while every QGIS-free suite passed. Stating
# it here is what lets one `cargo test --workspace` cover the whole tree.
QGIS_PLUGINPATH = "$CONDA_PREFIX/lib/qgis/plugins"
QT_QPA_PLATFORM = "offscreen"

[feature.utils.dependencies]
lefthook = ">=2.1.9,<3"
convco = ">=0.6.4,<0.7"
taplo = ">=0.10.0,<0.11"
actionlint = ">=1.7.12,<2"

[feature.bun.dependencies]
# 1.2+ is required to read the text-format root bun.lock.
# rust: `napi build` spawns `cargo metadata` and `cargo build`; the addon
# cannot be produced without it on PATH.
bun = { workspace = true }
rust = { workspace = true }

[feature.bun.tasks]
# The whole JS toolchain runs under bun, and this task is how a caller reaches
# it: `pixi run bun test`, `pixi run bun run build`. `default-environment` puts
# the command in the `bun` environment, so `pixi run -e bun bun …` is the same
# thing spelled explicitly.
#
# Always invoke workspace CLIs through `bun run <script>` or `bun x`. A path like
# `bun ./node_modules/.bin/napi` fails with "Module not found" — `.bin` entries
# are symlinks with a node shebang, not modules bun can resolve by path.
bun = { cmd = "bun", default-environment = "bun" }

# One install for the whole Bun workspace at the repository root: package.json
# declares `workspaces: ["ts-packages/*", "docs", ...]`, so this covers the docs
# app, the napi package and the SDK bridge. Members carry no lockfile of their
# own; root bun.lock is the single resolution record.
bun-install = { cmd = "bun install --frozen-lockfile", description = "Install the Bun workspace from the root lockfile", default-environment = "bun" }

# Repo-wide agent tooling follows pixi-sandbox: the packages are installed in
# the root Bun workspace and invoked through `bun x`, which uses Bun instead of
# the packages' Node shebangs. This keeps the commands usable in the restored
# `bun` environment, which intentionally has no Node.js runtime.
backlog = { cmd = "bun x backlog", depends-on = [
  "bun-install",
], description = "Manage the Markdown project backlog", default-environment = "bun" }
skills = { cmd = "bun x skills", depends-on = [
  "bun-install",
], description = "Manage agent skills", default-environment = "bun" }

# ── environments ──────────────────────────────────────────────────────────────
# The `py` and `sdk` feature-task groups are gone from this manifest: all
# package-specific verbs (build, test, lint, format, coverage) live in the
# packages themselves (their package.json scripts) and are orchestrated by
# turbo. Per environments below, `default` needs no feature that carries no
# dependencies.

[environments]
# See the header: two environments, split by an icu conflict that no single
# solve can satisfy. `default` is what the `developer` bundle in
# pixi-sandbox.toml packs.
default = { features = [
  "rust",
  "cxx",
  "cpp-test",
  "rust-tools",
  "qgis",
  "py-runtime",
  "utils",
] }
# QGIS-free on purpose: ts-packages/qgis-node/src-rust and everything it depends on are pure
# Rust, so adding `qgis` here would reintroduce the icu conflict.
bun = { features = ["bun"] }

# ---------------------------------------------------------------------------
# Tasks. This manifest keeps ONLY repo-management tasks: changelog and
# conventional-commit tooling, backlog/skill agents, hook plumbing (_biome /
# check-cpp — lefthook calls them with staged files), manifest canonicality
# and workflow lints, the libqca environment repair, and the qgis-sys codegen
# scaffold. Everything package-specific (build / test / lint / format /
# coverage for Rust, Python and JS) is defined in the packages' own
# package.json scripts and orchestrated from the root by turborepo:
#
#   bun x turbo run build / test / lint / format / coverage
#
# `default` is the implicit environment, so `pixi run <task>` needs no flag and
# `-e default` stays valid for anything that prefers to be explicit. The JS
# tasks pin `default-environment = "bun"` because their commands do not exist in
# `default` — see the icu note in the header.
# ---------------------------------------------------------------------------
[tasks]

# Every task below is one line, because the logic behind it is a subcommand of
# crates/xtask rather than a shell file: `pixi run xtask <subcommand>` is THE
# entry point, and the named tasks under it are aliases for the three callers
# (lefthook, turbo, CI) that pass arguments or want a memorable verb. Adding a
# repository-wide verb means adding a subcommand to crates/xtask and, usually,
# no line here at all. See .knowledge/decisions/D10-xtask-over-shell-scripts.md.
#
# What is NOT here: the per-package build/test/lint/format/coverage verbs.
# Those live in the packages' own package.json scripts and are orchestrated by
# turbo (`bun x turbo run <task>`), so the command that builds a package is in
# the manifest a reader of that package already opens.

# ── the entry point ───────────────────────────────────────────────────────────
# Typed repository automation (crates/xtask): ci, check-cpp, lint-toml,
# pack-check, setup-qca, ci-failure-summary, scaffold, release <step>. Extra
# arguments pass straight through: `pixi run xtask release verify-version v1.2.3`.
xtask = { cmd = "cargo run -q -p xtask --", description = "Run a repository-automation subcommand (crates/xtask)", default-environment = "default" }

# ── environment repair ────────────────────────────────────────────────────────
setup = { cmd = "cargo run -q -p xtask -- setup-qca", description = "Ensure the Qt5 QCA soname QGIS asks for is present", default-environment = "default" }

# ── the gate ──────────────────────────────────────────────────────────────────
# One call, run identically by a contributor before pushing and by ci.yml:
# repo lints, turbo lint, format-drift gate, tests, pack:check, coverage.
# It runs in `default` (where cargo and the QGIS toolchain are) and re-enters
# `-e bun` for every turbo fan-out, exactly as the shell gate did.
ci = { cmd = "cargo run -q -p xtask -- ci", description = "The full gate: repo lints, turbo lint/format/test/pack:check, coverage", default-environment = "default" }
gates = { cmd = "cargo run -q -p xtask -- ci --no-coverage --offline", description = "`ci` without coverage, forced offline for restored-sandbox verification", default-environment = "default" }

# ── lint tooling (lefthook, the gate and CI share these) ──────────────────────
# Optional arguments are staged files from lefthook; with none they check the
# whole relevant tree.
check-cpp = { cmd = "cargo run -q -p xtask -- check-cpp", description = "clang-format gate for the native manager (staged files, or the whole tree)", default-environment = "default" }
# The writing counterpart of check-cpp, and the fourth pass of the lint gate.
# Both used to be steps inside scripts/rust-format.sh and scripts/rust-lint.sh;
# as subcommands they are what lets @qgis/rust's `format` and `lint` scripts be
# one line each. clang-tidy in particular has to discover its own include paths —
# the native-manager compile database, Qt include paths, and the GCC dir carrying stddef.h — which
# is why it is a program and not a flag.
format-cpp = { cmd = "cargo run -q -p xtask -- format-cpp", description = "clang-format the native manager in place", default-environment = "default" }
# The native manager's own GoogleTest/RapidCheck suite, built with the cmake
# and ninja this environment already declares. @qgis/rust's `test` script calls
# it, so the turbo fan-out and therefore `pixi run ci` cover it.
test-cpp = { cmd = "cargo run -q -p xtask -- test-cpp", description = "Build and run the native manager's GoogleTest/RapidCheck suite", default-environment = "default" }
clang-tidy = { cmd = "cargo run -q -p xtask -- clang-tidy", description = "clang-tidy over the native manager, discovering the include paths it needs", default-environment = "default" }
lint-toml = { cmd = "cargo run -q -p xtask -- lint-toml", description = "taplo canonicality check for pixi.toml", default-environment = "default" }
lint-actions = { cmd = "actionlint", description = "Lint .github/workflows/*.yml", default-environment = "default" }
lint-commit = { cmd = "convco check --from-stdin", description = "Validate a commit message against the conventional-commit spec", default-environment = "default" }

# ── release plumbing ──────────────────────────────────────────────────────────
# `[workspace] version` at the top of this file is the single source of truth;
# these three read, verify and rewrite it. See scripts/version.ts.
version = { cmd = "bun scripts/version.ts", description = "Print the release version", depends-on = [
  "bun-install",
], default-environment = "bun" }
version-check = { cmd = "bun scripts/version.ts --check", description = "Fail if any manifest disagrees with the workspace version", depends-on = [
  "bun-install",
], default-environment = "bun" }
version-set = { cmd = "bun scripts/version.ts --set", description = "Rewrite every manifest to a new X.Y.Z (used by prepare-release)", depends-on = [
  "bun-install",
], default-environment = "bun" }
changelog = { cmd = "convco changelog", description = "Preview the conventional-commit changelog for the pending release", default-environment = "default" }

# ── codegen ───────────────────────────────────────────────────────────────────
# Usage: pixi run scaffold <operation> <handler>
scaffold = { cmd = "cargo run -q -p xtask -- scaffold", description = "Add an operation to the native-manager API manifest and regenerate its fragments", default-environment = "default" }

# ── internal staged-file plumbing ─────────────────────────────────────────────
# lefthook's js-biome job checks exactly the files being committed. Repo-wide
# enforcement runs through turbo (`bun x turbo run lint`), not through here.
_biome = { cmd = "bun x biome check", depends-on = [
  "bun-install",
], description = "Internal: biome check on explicit files (lefthook staged-files path)", default-environment = "bun" }
