# qgis-rs — THE workspace manifest.
#
# Every Rust crate is a member of the Cargo workspace at the repository root
# (`crates/*`); the language distributions are packaging-only trees that point
# back into it:
#
#   py-packages/<dist>   maturin project: pyproject.toml + python sources + tests
#   ts-packages/<dist>   Bun/npm project: package.json + JS/TS sources + tests
#   crates/<crate>       Rust: the engine crates and the PyO3 / NAPI cores
#
# Environments
#   default    Rust/C++ development + the QGIS headers (cargo test, clang-tidy)
#   docs       Bun for apps/docs (Astro Starlight)
#   sdk        the qgis-sdk Python package built from source, with QGIS
#   py         the qgis-rs Python wheel, no QGIS
#   py-qgis    the qgis-rs Python wheel, with QGIS
#   node       the qgis-rs npm package (napi addon), no QGIS
#
# Pins (verified 2026-09-18): rust 1.96.x, QGIS >=3.44.9, clang-tools 22.x.
# `pixi-build` is a PREVIEW feature — the `[package]` table shape may change
# between pixi minors, so `requires-pixi` and the workflows' pixi-version move
# together. Python is deliberately NOT declared as a dependency of the QGIS
# environments: the conda-forge `qgis` package pulls in the interpreter its
# PyQGIS bindings were built against, and a separate pin could only drift.
# See .knowledge/pixi.md.

[workspace]
name          = "qgis-rs"
channels      = ["conda-forge"]
platforms     = ["linux-64"]
# Enables the `[package]` section used by py-packages/qgis-sdk, which the workspace
# pulls in as a source dependency. Still a preview feature upstream:
# https://pixi.prefix.dev/latest/build/workspace/
preview       = ["pixi-build"]
requires-pixi = ">=0.79.0"

# One place to bump a version; the tables below opt in with { workspace = true }.
[workspace.dependencies]
rust    = ">=1.96.0,<1.97"
qgis    = ">=3.44.9,<4"
maturin = ">=1.7,<2"
pytest  = ">=8,<9"
python  = ">=3.11,<3.15"
bun     = ">=1.2.0,<2"

[dependencies]
rust         = { workspace = true }
cxx-compiler = ">=1.11.0,<2"
clang-tools  = ">=22.1.8,<23"
lefthook     = ">=2.1.9,<3"
convco       = ">=0.6.4,<0.7"

[feature.qgis.dependencies]
qgis = { workspace = true }

[feature.docs.dependencies]
# 1.2+ is required to read the text-format apps/docs/bun.lock.
bun = { workspace = true }

[feature.docs.tasks]
docs-install = { cmd = "bun install --frozen-lockfile", cwd = "apps/docs", description = "Install the docs workspace dependencies" }
docs-dev = { cmd = "bun run dev", cwd = "apps/docs", depends-on = ["docs-install"] }
docs-build = { cmd = "bun run build", cwd = "apps/docs", depends-on = ["docs-install"] }
docs-preview = { cmd = "bun run preview", cwd = "apps/docs", depends-on = ["docs-build"] }

# ── qgis-rs (Python bindings + Rust CLI) ──────────────────────────────────────
# The pip-installable `qgis-rs` package — Rust extension via PyO3 + binary.
# Pure-Rust ops (tile planning, extent parsing) work without QGIS.
# Full rendering needs QGIS backend (conda-forge qgis package).

[feature.py.dependencies]
python = { workspace = true }
maturin = { workspace = true }
# The wheel under test; pixi drives maturin through its pyproject.
qgis-rs = { path = "./py-packages/qgis-rs" }
pytest = { workspace = true }

[feature.py.tasks]
py-build = { cmd = "maturin build --release -o dist", cwd = "py-packages/qgis-rs" }
py-develop = { cmd = "maturin develop", cwd = "py-packages/qgis-rs" }
py-test = { cmd = "python -m pytest py-packages/qgis-rs/tests -v" }
py-cli-test = { cmd = "python -m qgis_rs.cli --help && qgis-cli --help || python -m qgis_rs.cli --help" }

# ── qgis-node (TypeScript / Node.js bindings + Rust CLI) ─────────────────────
# npm-installable `qgis-rs` package — Rust NAPI addon + binary.

[feature.node.dependencies]
nodejs = ">=20,<23"
rust = { workspace = true }

[feature.node.tasks]
node-install = { cmd = "npm install", cwd = "ts-packages/qgis-node" }
node-build = { cmd = "npx napi build --platform --release --manifest-path ../../crates/qgis-node/Cargo.toml -o .", cwd = "ts-packages/qgis-node", depends-on = ["node-install"] }
node-test = { cmd = "npm test", cwd = "ts-packages/qgis-node" }
node-example = { cmd = "node ../../examples/typescript_api.js", cwd = "ts-packages/qgis-node" }

# ── qgis-sdk (Python plugin SDK) ──────────────────────────────────────────────
# Now with Rust-native CLI (qgis-plugin binary) built via maturin.
# The conda-forge `qgis` package provides Python interpreter, so we don't
# declare python separately — it comes from qgis.

[feature.sdk.dependencies]
# Source dependency: pixi builds py-packages/qgis-sdk with pixi-build-python (maturin).
qgis-sdk = { path = "./py-packages/qgis-sdk" }
maturin = { workspace = true }
rust = { workspace = true }
pytest = { workspace = true }

# The conda-forge qgis package already exports these through
# etc/conda/activate.d/qgis-activate.sh, which pixi runs for `pixi run` and
# `pixi shell`. They are repeated here so `import qgis` does not depend on
# remembering that, and so the paths are visible in the manifest.
# ($VAR syntax: activation runs under bash; platforms are linux-64 only.)
[feature.sdk.activation.env]
PYTHONPATH = "$CONDA_PREFIX/share/qgis/python/plugins:$CONDA_PREFIX/share/qgis/python:$PYTHONPATH"
QGIS_PREFIX_PATH = "$CONDA_PREFIX"
QT_QPA_PLATFORM = "offscreen"

[feature.sdk.tasks]
sdk-test = { cmd = "python -m pytest -q", cwd = "py-packages/qgis-sdk" }
sdk-test-rust = { cmd = "python -m pytest tests/test_cli.py -v", cwd = "py-packages/qgis-sdk" }
sdk-cli-test = { cmd = "python -m qgis_sdk.cli --help && qgis-plugin --help || python -m qgis_sdk.cli --help" }
# Prints the interpreter, the PyQGIS paths, and whether qgis.core / qgis_sdk
# resolve. Exits non-zero when the environment is broken.
sdk-doctor = { cmd = "python scripts/doctor.py", cwd = "py-packages/qgis-sdk" }
sdk-build = { cmd = "maturin build --release -o dist", cwd = "py-packages/qgis-sdk" }
sdk-develop = { cmd = "maturin develop", cwd = "py-packages/qgis-sdk" }

[environments]
default = { features = ["qgis"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
# Its own solve-group on purpose: the `sdk` environment needs the pixi-build
# backend to build qgis-sdk from source, and keeping it out of the "default"
# group means `pixi install -e default` / `-e docs` never need that backend.
sdk = { features = ["qgis", "sdk"], solve-group = "sdk" }
py = { features = ["py"], solve-group = "py" }
py-qgis = { features = ["qgis", "py"], solve-group = "py-qgis" }
node = { features = ["node"], solve-group = "node" }

# ---------------------------------------------------------------------------
# Tasks. CI invokes cargo / pytest / bun directly (.github/workflows); these are
# the user-facing entrypoints, one verb per action, sharing pixi-sandbox's
# vocabulary: fmt / clippy / build / test / gates / ci.
# ---------------------------------------------------------------------------
[tasks]

# ── internal ──────────────────────────────────────────────────────────────────
setup = { cmd = "ln -sf $CONDA_PREFIX/lib/libqca-qt6.so.2 $CONDA_PREFIX/lib/libqca-qt5.so.2", description = "Link the Qt6-only libqca under the Qt5 soname QGIS still asks for" }
_build-for-lint = { cmd = "cargo build -p qgis-sys" }

# ── formatting ────────────────────────────────────────────────────────────────
fmt-rs  = { cmd = "cargo fmt --all" }
fmt-cpp = { cmd = "bash -c 'clang-format -i $(find crates/qgis-sys/src crates/qgis-sys/include -name \"*.cpp\" -o -name \"*.h\")'" }
fmt     = { depends-on = ["fmt-rs", "fmt-cpp"] }

# ── checks ────────────────────────────────────────────────────────────────────
fmt-check = { cmd = "cargo fmt --all --check" }
clippy    = { cmd = "cargo clippy --workspace --all-targets -- -D warnings" }
build     = { cmd = "cargo build --release" }
check-cpp = { cmd = "bash -c 'clang-format --dry-run --Werror $(find crates/qgis-sys/src crates/qgis-sys/include -name \"*.cpp\" -o -name \"*.h\")'" }

lint-cpp = { cmd = """bash -c '
  SRCS=$(find crates/qgis-sys/src -name "*.cpp")
  QT_INC=$CONDA_PREFIX/include/qt
  [ ! -d "$QT_INC" ] && QT_INC=$CONDA_PREFIX/include/qt6
  CXX_OUT=$(find target/debug/build/qgis-sys-*/out/cxxbridge -maxdepth 0 2>/dev/null | head -1)
  clang-tidy $SRCS \
    --extra-arg=--sysroot=$CONDA_PREFIX/x86_64-conda-linux-gnu/sysroot \
    --extra-arg=-I$(find $CONDA_PREFIX/lib/gcc -name "stddef.h" | head -1 | xargs dirname) \
    -- -std=c++17 \
    -Icrates/qgis-sys \
    -Icrates/qgis-sys/include \
    -I${CXX_OUT}/include \
    -I${CXX_OUT}/crate \
    -I$CONDA_PREFIX/include/qgis \
    -I$QT_INC \
    -I$QT_INC/QtCore \
    -I$QT_INC/QtGui \
    -I$QT_INC/QtWidgets \
    -I$QT_INC/QtXml'""", depends-on = ["_build-for-lint"] }

# `lint` is the full-codebase gate: Rust lints plus clang-tidy over the shims.
lint = { depends-on = ["clippy", "lint-cpp"] }

# ── tests ─────────────────────────────────────────────────────────────────────
[tasks.test]
args = [{ arg = "package", default = "" }, { arg = "clean", default = "" }]
cmd = """bash -c '
  if [ "{{ clean }}" = "--clean" ]; then
    if [ -n "{{ package }}" ]; then
      cargo clean -p {{ package }}
    else
      cargo clean
    fi
  fi

  if [ -n "{{ package }}" ]; then
    QT_QPA_PLATFORM=offscreen \
    cargo test -p {{ package }} --no-default-features \
      --test application_info -- --test-threads=1
  else
    QT_QPA_PLATFORM=offscreen \
    cargo test --workspace --no-default-features \
      --test application_info -- --test-threads=1
  fi'"""
depends-on = ["setup"]

[tasks.test-full]
args = [{ arg = "package", default = "" }, { arg = "clean", default = "" }]
cmd = """bash -c '
  if [ "{{ clean }}" = "--clean" ]; then
    if [ -n "{{ package }}" ]; then
      cargo clean -p {{ package }}
    else
      cargo clean
    fi
  fi

  if [ -n "{{ package }}" ]; then
    PROJ_DATA=$CONDA_PREFIX/share/proj \
    QT_QPA_PLATFORM=offscreen \
    QGIS_PLUGINPATH=$CONDA_PREFIX/lib/qgis/plugins \
    cargo test -p {{ package }} --no-default-features \
      --test application_lifecycle --test vector_layer \
      -- --test-threads=1
  else
    PROJ_DATA=$CONDA_PREFIX/share/proj \
    QT_QPA_PLATFORM=offscreen \
    QGIS_PLUGINPATH=$CONDA_PREFIX/lib/qgis/plugins \
    cargo test --workspace --no-default-features \
      --test application_lifecycle --test vector_layer \
      -- --test-threads=1
  fi'"""
depends-on = ["setup"]

# ── clean ─────────────────────────────────────────────────────────────────────
[tasks.clean]
args = [{ arg = "package", default = "" }]
cmd = "bash -c 'if [ -n \"{{ package }}\" ]; then cargo clean -p {{ package }}; else cargo clean; fi'"

# ── scaffold ──────────────────────────────────────────────────────────────────
# Usage: pixi run scaffold <layer> <concept> <qgis_class> <short_name>
# Example: pixi run scaffold core geometry QgsGeometry geometry
[tasks.scaffold]
args = [
  { arg = "layer" },
  { arg = "concept" },
  { arg = "qgis_class" },
  { arg = "short_name" },
]
cmd = """bash -c '
  CRATE=crates/qgis-sys
  LAYER="{{ layer }}"
  CONCEPT="{{ concept }}"
  QCLASS="{{ qgis_class }}"
  SHORT="{{ short_name }}"
  HANDLE="${QCLASS}Handle"
  DIR="$CRATE/src/$LAYER/$CONCEPT"

  mkdir -p "$DIR"

  # ── header ──────────────────────────────────────────────────────────────
  cat > "$CRATE/include/$LAYER/$CONCEPT.h" << EOF
#pragma once

#include "rust/cxx.h"
#include "qgis-sys/include/core/handle.h"

namespace qgis_shim::$LAYER {

QGIS_DECLARE_HANDLE($HANDLE);

} // namespace qgis_shim::$LAYER

#include "qgis-sys/src/$LAYER/$CONCEPT/$SHORT.rs.h"

namespace qgis_shim::$LAYER {

// TODO: declare FFI functions here

} // namespace qgis_shim::$LAYER
EOF

  # ── rust bridge ─────────────────────────────────────────────────────────
  cat > "$DIR/$SHORT.rs" << EOF
#[cxx::bridge(namespace = "qgis_shim::$LAYER")]
pub mod ffi {
    unsafe extern "C++" {
        include!("qgis-sys/include/$LAYER/$CONCEPT.h");

        type $HANDLE;

        // TODO: declare FFI functions here
    }
}
EOF

  # ── cpp shim ────────────────────────────────────────────────────────────
  cat > "$DIR/$SHORT.cpp" << EOF
#include "qgis-sys/include/$LAYER/$CONCEPT.h"
#include "qgis-sys/include/core/convert.h"

// TODO: #include <qgs....h>

// QGIS_DEFINE_HANDLE_DTOR(qgis_shim::$LAYER, $HANDLE, ::$QCLASS)

namespace {

// QGIS_HANDLE_CAST(qgis_shim::$LAYER::$HANDLE, ::$QCLASS)

} // namespace

namespace qgis_shim::$LAYER {

// TODO: implement FFI functions here

} // namespace qgis_shim::$LAYER
EOF

  # ── mod.rs ──────────────────────────────────────────────────────────────
  cat > "$DIR/mod.rs" << EOF
pub mod $SHORT;
EOF

  # ── wire into parent mod.rs ─────────────────────────────────────────────
  PARENT_MOD="$CRATE/src/$LAYER/mod.rs"
  if ! grep -q "pub mod $CONCEPT;" "$PARENT_MOD" 2>/dev/null; then
    echo "pub mod $CONCEPT;" >> "$PARENT_MOD"
  fi

  # ── wire into lib.rs ────────────────────────────────────────────────────
  LIB_RS="$CRATE/src/lib.rs"
  ALIAS="${SHORT}_ffi"
  USE_LINE="pub use $LAYER::$CONCEPT::$SHORT::ffi as $ALIAS;"
  if ! grep -q "$ALIAS" "$LIB_RS" 2>/dev/null; then
    echo "$USE_LINE" >> "$LIB_RS"
  fi

  echo ""
  echo "✅ scaffolded $LAYER/$CONCEPT"
  echo "   header:  $CRATE/include/$LAYER/$CONCEPT.h"
  echo "   bridge:  $DIR/$SHORT.rs"
  echo "   shim:    $DIR/$SHORT.cpp"
  echo "   mod:     $DIR/mod.rs"
  echo ""
  echo "Next steps:"
  echo "  1. Edit the header — declare FFI functions"
  echo "  2. Edit the .rs    — declare matching Rust signatures"
  echo "  3. Edit the .cpp   — implement the functions"
  echo "  4. cargo build -p qgis-sys"
'"""

# ── gates ─────────────────────────────────────────────────────────────────────
# One command for "what CI will run". `gates` needs no QGIS at runtime; `ci-full`
# adds clang-tidy and the QGIS-backed test binaries, so it wants the `default`
# environment installed: `pixi run -e default ci-full`.
[tasks.gates]
description = "Format check + clippy + the QGIS-free test run"
depends-on = ["fmt-check", "clippy", "test"]

[tasks.ci]
description = "`gates` plus the C++ format check"
depends-on = ["gates", "check-cpp"]

[tasks.ci-full]
description = "Everything: `ci` plus clang-tidy and the QGIS-backed tests"
depends-on = ["ci", "lint-cpp", "test-full"]
