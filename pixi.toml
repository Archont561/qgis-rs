# qgis-rs — THE workspace manifest.
#
# Every Rust crate is a member of the Cargo workspace at the repository root
# (`crates/*`); the language distributions are packaging-only trees that point
# back into it:
#
#   py-packages/<dist>   maturin project: pyproject.toml + python sources + tests
#   ts-packages/<dist>   Bun/npm project: package.json + JS/TS sources + tests
#   crates/<crate>       Rust: the engine crates and the PyO3 / NAPI cores
#
# Environments (features are layered, so nothing installs more than it needs):
#   dev      QGIS + Rust + C++ toolchain + utils + sandbox — everything a
#            contributor needs; the primary environment (umbrella tasks default
#            to it via `default-environment`).
#   ci       QGIS + Rust + C++ toolchain + sandbox — what CI actually runs.
#   utils    git-hook / lint tooling only (lefthook, convco, taplo, actionlint).
#   docs     Bun for apps/docs (Astro Starlight).
#   sdk      the qgis-sdk Python package built from source, with QGIS.
#   py       the qgis-rs Python wheel, no QGIS.
#   py-qgis  the qgis-rs Python wheel, with QGIS.
#   node     the qgis-rs npm package (napi addon), no QGIS.
#
# The `docs` feature (bun, which pins icu <76) is NOT part of `dev`/`ci`:
# conda-forge QGIS needs icu >=78.3, so the two cannot share an environment —
# docs tasks run against the separate `docs` environment instead.
#
# There is deliberately NO `default` environment: bare `pixi run <task>`
# resolves through each task's `default-environment` (dev for the umbrella
# tasks, docs/py/node/sdk for the language-dist tasks), and every workflow
# passes `-e` explicitly. Keeping the root `[dependencies]` table empty is what
# makes the layering real — the default feature would otherwise leak its
# packages into every environment.
#
# NOTE (pixi 0.81): `default-environment` is only accepted on tasks that have a
# `cmd`, declared inline in `[tasks]`. Pure aggregators (gates/ci/ci-full) omit
# it — their environment is resolved through their `depends-on` tasks.
#
# Pins (verified 2026-09-18): rust 1.96.x, QGIS >=3.44.9, clang-tools 22.x,
# pixi-pack 0.7.x (conda-forge). Adding a pin means one `pixi lock` to refresh
# pixi.lock — CI's `--locked` installs fail until that lands.
# `pixi-build` is a PREVIEW feature — the `[package]` table shape may change
# between pixi minors, so `requires-pixi` and the workflows' pixi-version move
# together. Python is deliberately NOT declared as a dependency of the QGIS
# environments: the conda-forge `qgis` package pulls in the interpreter its
# PyQGIS bindings were built against, and a separate pin could only drift.
# See .knowledge/pixi.md.

[workspace]
name = "qgis-rs"
channels = ["conda-forge"]
platforms = ["linux-64"]
# Enables the `[package]` section used by py-packages/qgis-sdk, which the workspace
# pulls in as a source dependency. Still a preview feature upstream:
# https://pixi.prefix.dev/latest/build/workspace/
preview = ["pixi-build"]
requires-pixi = ">=0.79.0"

# One place to bump a version; the tables below opt in with { workspace = true }.
[workspace.dependencies]
rust = ">=1.96.0,<1.97"
pixi-pack = ">=0.7,<0.8" # sandbox feature: `pixi run -e dev pack` / scripts/pack-env.sh
qgis = ">=3.44.9,<4"
maturin = ">=1.7,<2"
pytest = ">=8,<9"
python = ">=3.11,<3.15"
bun = ">=1.2.0,<2"

# ── feature layers ────────────────────────────────────────────────────────────
# The root `[dependencies]` table is intentionally empty; every dependency lives
# in a feature so each environment installs only what it needs.

[feature.rust.dependencies]
rust = { workspace = true }

[feature.cxx.dependencies]
cxx-compiler = ">=1.11.0,<2"
clang-tools = ">=22.1.8,<23"

[feature.qgis.dependencies]
qgis = { workspace = true }

[feature.utils.dependencies]
lefthook = ">=2.1.9,<3"
convco = ">=0.6.4,<0.7"
taplo = "*"
actionlint = "*"

[feature.docs.dependencies]
# 1.2+ is required to read the text-format apps/docs/bun.lock.
bun = { workspace = true }

[feature.docs.tasks]
docs-install = { cmd = "bun install --frozen-lockfile", cwd = "apps/docs", description = "Install the docs workspace dependencies", default-environment = "docs" }
docs-dev = { cmd = "bun run dev", cwd = "apps/docs", depends-on = [
  "docs-install",
], default-environment = "docs" }
docs-build = { cmd = "bun run build", cwd = "apps/docs", default-environment = "docs", depends-on = [
  "docs-install",
] }
docs-preview = { cmd = "bun run preview", cwd = "apps/docs", depends-on = [
  "docs-build",
], default-environment = "docs" }

[feature.sandbox.dependencies]
# Local reproduction of the env-pack pipeline (scripts/pack-env.sh). CI fetches
# its own helper tools, so this feature is only for developers.
pixi-pack = { workspace = true }

# ── qgis-rs (Python bindings + Rust CLI) ──────────────────────────────────────
# The pip-installable `qgis-rs` package — Rust extension via PyO3 + binary.
# Pure-Rust ops (tile planning, extent parsing) work without QGIS.
# Full rendering needs QGIS backend (conda-forge qgis package).

[feature.py.dependencies]
python = { workspace = true }
maturin = { workspace = true }
# The wheel under test; pixi drives maturin through its pyproject.
qgis-rs = { path = "./py-packages/qgis-rs" }
pytest = { workspace = true }

[feature.py.tasks]
py-build = { cmd = "maturin build --release -o dist", cwd = "py-packages/qgis-rs", default-environment = "py" }
py-develop = { cmd = "maturin develop", cwd = "py-packages/qgis-rs", default-environment = "py" }
py-test = { cmd = "python -m pytest py-packages/qgis-rs/tests -v", default-environment = "py" }
py-cli-test = { cmd = "python -m qgis_rs.cli --help && qgis-cli --help || python -m qgis_rs.cli --help", default-environment = "py" }

# ── qgis-node (TypeScript / Node.js bindings + Rust CLI) ─────────────────────
# npm-installable `qgis-rs` package — Rust NAPI addon + binary.

[feature.node.dependencies]
nodejs = ">=20,<23"
rust = { workspace = true }

[feature.node.tasks]
node-install = { cmd = "npm install", cwd = "ts-packages/qgis-node", default-environment = "node" }
node-build = { cmd = "npx napi build --platform --release --manifest-path ../../crates/qgis-node/Cargo.toml -o .", cwd = "ts-packages/qgis-node", depends-on = [
  "node-install",
], default-environment = "node" }
node-test = { cmd = "npm test", cwd = "ts-packages/qgis-node", default-environment = "node" }
node-example = { cmd = "node ../../examples/typescript_api.js", cwd = "ts-packages/qgis-node", default-environment = "node" }

# ── qgis-sdk (Python plugin SDK) ──────────────────────────────────────────────
# Now with Rust-native CLI (qgis-plugin binary) built via maturin.
# The conda-forge `qgis` package provides Python interpreter, so we don't
# declare python separately — it comes from qgis.

[feature.sdk.dependencies]
# Source dependency: pixi builds py-packages/qgis-sdk with pixi-build-python (maturin).
qgis-sdk = { path = "./py-packages/qgis-sdk" }
maturin = { workspace = true }
rust = { workspace = true }
pytest = { workspace = true }

# The conda-forge qgis package already exports these through
# etc/conda/activate.d/qgis-activate.sh, which pixi runs for `pixi run` and
# `pixi shell`. They are repeated here so `import qgis` does not depend on
# remembering that, and so the paths are visible in the manifest.
# ($VAR syntax: activation runs under bash; platforms are linux-64 only.)
[feature.sdk.activation.env]
PYTHONPATH = "$CONDA_PREFIX/share/qgis/python/plugins:$CONDA_PREFIX/share/qgis/python:$PYTHONPATH"
QGIS_PREFIX_PATH = "$CONDA_PREFIX"
QT_QPA_PLATFORM = "offscreen"

[feature.sdk.tasks]
sdk-test = { cmd = "python -m pytest -q", cwd = "py-packages/qgis-sdk", default-environment = "sdk" }
sdk-test-rust = { cmd = "python -m pytest tests/test_cli.py -v", cwd = "py-packages/qgis-sdk", default-environment = "sdk" }
sdk-cli-test = { cmd = "python -m qgis_sdk.cli --help && qgis-plugin --help || python -m qgis_sdk.cli --help", default-environment = "sdk" }
# Prints the interpreter, the PyQGIS paths, and whether qgis.core / qgis_sdk
# resolve. Exits non-zero when the environment is broken.
sdk-doctor = { cmd = "python scripts/doctor.py", cwd = "py-packages/qgis-sdk", default-environment = "sdk" }
sdk-build = { cmd = "maturin build --release -o dist", cwd = "py-packages/qgis-sdk", default-environment = "sdk" }
sdk-develop = { cmd = "maturin develop", cwd = "py-packages/qgis-sdk", default-environment = "sdk" }

[environments]
dev = { features = [
  "rust",
  "cxx",
  "qgis",
  "utils",
  "sandbox",
], solve-group = "dev" }
ci = { features = ["rust", "cxx", "qgis", "sandbox"], solve-group = "ci" }
utils = { features = ["utils"], solve-group = "utils" }
docs = { features = ["docs"], solve-group = "docs" }
# Its own solve-group on purpose: the `sdk` environment needs the pixi-build
# backend to build qgis-sdk from source, and keeping it out of the `dev` group
# means `pixi install -e dev` / `-e ci` never need that backend.
sdk = { features = ["qgis", "sdk"], solve-group = "sdk" }
py = { features = ["py"], solve-group = "py" }
py-qgis = { features = ["qgis", "py"], solve-group = "py-qgis" }
node = { features = ["node"], solve-group = "node" }

# ---------------------------------------------------------------------------
# Tasks. CI invokes cargo / pytest / bun directly (.github/workflows); these are
# the user-facing entrypoints, one verb per action, sharing pixi-sandbox's
# vocabulary: fmt / clippy / build / test / gates / ci.
#
# There is no `default` environment, so every user-facing task sets
# `default-environment` (dev for the umbrella tasks, docs/py/node/sdk for the
# language-dist tasks). lefthook extends this by calling `pixi run -e dev …`.
# ---------------------------------------------------------------------------
[tasks]

# ── internal ──────────────────────────────────────────────────────────────────
setup = { cmd = "ln -sf $CONDA_PREFIX/lib/libqca-qt6.so.2 $CONDA_PREFIX/lib/libqca-qt5.so.2", description = "Link the Qt6-only libqca under the Qt5 soname QGIS still asks for", default-environment = "dev" }
_build-for-lint = { cmd = "cargo build -p qgis-sys", default-environment = "dev" }

# ── formatting ────────────────────────────────────────────────────────────────
fmt-rs = { cmd = "cargo fmt --all", default-environment = "dev" }
fmt-cpp = { cmd = "bash -c 'clang-format -i $(find crates/qgis-sys/src crates/qgis-sys/include -name \"*.cpp\" -o -name \"*.h\")'", default-environment = "dev" }
fmt = { depends-on = ["fmt-rs", "fmt-cpp"] }

# ── checks ────────────────────────────────────────────────────────────────────
fmt-check = { cmd = "cargo fmt --all --check", default-environment = "dev" }
clippy = { cmd = "cargo clippy --workspace --all-targets -- -D warnings", default-environment = "dev" }
build = { cmd = "cargo build --release", default-environment = "dev" }
# Optional args: lefthook passes only the staged C++ files (`pixi run check-cpp
# -- a.cpp b.h`); with no args the whole tree is checked via `find`. `ci`
# depends on this task unchanged.
check-cpp = { cmd = """bash -c '
  if [ $# -gt 0 ]; then
    clang-format --dry-run --Werror "$@"
  else
    clang-format --dry-run --Werror $(find crates/qgis-sys/src crates/qgis-sys/include -name "*.cpp" -o -name "*.h")
  fi' _""", default-environment = "dev" }

lint-cpp = { cmd = """bash -c '
  SRCS=$(find crates/qgis-sys/src -name "*.cpp")
  QT_INC=$CONDA_PREFIX/include/qt
  [ ! -d "$QT_INC" ] && QT_INC=$CONDA_PREFIX/include/qt6
  CXX_OUT=$(find target/debug/build/qgis-sys-*/out/cxxbridge -maxdepth 0 2>/dev/null | head -1)
  clang-tidy $SRCS \
    --extra-arg=--sysroot=$CONDA_PREFIX/x86_64-conda-linux-gnu/sysroot \
    --extra-arg=-I$(find $CONDA_PREFIX/lib/gcc -name "stddef.h" | head -1 | xargs dirname) \
    -- -std=c++17 \
    -Icrates/qgis-sys \
    -Icrates/qgis-sys/include \
    -I${CXX_OUT}/include \
    -I${CXX_OUT}/crate \
    -I$CONDA_PREFIX/include/qgis \
    -I$QT_INC \
    -I$QT_INC/QtCore \
    -I$QT_INC/QtGui \
    -I$QT_INC/QtWidgets \
    -I$QT_INC/QtXml'""", depends-on = [
  "_build-for-lint",
], default-environment = "dev" }

# `lint` is the full-codebase gate: Rust lints plus clang-tidy over the shims.
lint = { depends-on = ["clippy", "lint-cpp"] }

# ── lint tooling (lefthook + CI share these) ──────────────────────────────────
# Conventional-commit check for the `commit-msg` hook; reads the proposed
# message from stdin (git passes it via {1} in lefthook.yml).
lint-commit = { cmd = "convco check --from-stdin", default-environment = "dev" }
# Optional args like check-cpp: hooks check only staged manifests
# (`pixi run lint-toml -- a.toml b.toml`); bare `pixi run lint-toml` checks the
# workspace manifest alone. Only `pixi.toml` is kept in taplo's canonical form —
# the rest of the repo uses the aligned-`=` style, so it is deliberately not
# taplo-enforced.
lint-toml = { cmd = """bash -c '
  if [ $# -gt 0 ]; then
    taplo fmt --check "$@"
  else
    taplo fmt --check pixi.toml
  fi' _""", default-environment = "dev" }
# Scans .github/workflows/*.yml by default.
lint-actions = { cmd = "actionlint", default-environment = "dev" }

# ── packaging ─────────────────────────────────────────────────────────────────
# One implementation for both `pixi run pack` and env.yml: scripts/pack-env.sh
# packs the environment with pixi-pack and then unpacks the result to prove the
# toolchain works. Needs `pixi lock` after changing the pack tooling, since
# pixi-pack lives in [workspace.dependencies] rather than installed ad hoc.
pack = { cmd = "bash scripts/pack-env.sh", description = "Bundle an environment into a self-extracting pack under dist/ and smoke-test it", default-environment = "dev" }

# ── tests ─────────────────────────────────────────────────────────────────────
test = { args = [
  { arg = "package", default = "" },
  { arg = "clean", default = "" },
], cmd = """bash -c '
  if [ "{{ clean }}" = "--clean" ]; then
    if [ -n "{{ package }}" ]; then
      cargo clean -p {{ package }}
    else
      cargo clean
    fi
  fi

  if [ -n "{{ package }}" ]; then
    QT_QPA_PLATFORM=offscreen \
    cargo test -p {{ package }} --no-default-features \
      --test application_info -- --test-threads=1
  else
    QT_QPA_PLATFORM=offscreen \
    cargo test --workspace --no-default-features \
      --test application_info -- --test-threads=1
  fi'""", depends-on = [
  "setup",
], default-environment = "dev" }

test-full = { args = [
  { arg = "package", default = "" },
  { arg = "clean", default = "" },
], cmd = """bash -c '
  if [ "{{ clean }}" = "--clean" ]; then
    if [ -n "{{ package }}" ]; then
      cargo clean -p {{ package }}
    else
      cargo clean
    fi
  fi

  if [ -n "{{ package }}" ]; then
    PROJ_DATA=$CONDA_PREFIX/share/proj \
    QT_QPA_PLATFORM=offscreen \
    QGIS_PLUGINPATH=$CONDA_PREFIX/lib/qgis/plugins \
    cargo test -p {{ package }} --no-default-features \
      --test application_lifecycle --test vector_layer \
      -- --test-threads=1
  else
    PROJ_DATA=$CONDA_PREFIX/share/proj \
    QT_QPA_PLATFORM=offscreen \
    QGIS_PLUGINPATH=$CONDA_PREFIX/lib/qgis/plugins \
    cargo test --workspace --no-default-features \
      --test application_lifecycle --test vector_layer \
      -- --test-threads=1
  fi'""", depends-on = [
  "setup",
], default-environment = "dev" }

# ── clean ─────────────────────────────────────────────────────────────────────
clean = { args = [
  { arg = "package", default = "" },
], cmd = "bash -c 'if [ -n \"{{ package }}\" ]; then cargo clean -p {{ package }}; else cargo clean; fi'", default-environment = "dev" }

# ── scaffold ──────────────────────────────────────────────────────────────────
# Usage: pixi run scaffold <layer> <concept> <qgis_class> <short_name>
# Example: pixi run scaffold core geometry QgsGeometry geometry
scaffold = { args = [
  { arg = "layer" },
  { arg = "concept" },
  { arg = "qgis_class" },
  { arg = "short_name" },
], cmd = """bash -c '
  CRATE=crates/qgis-sys
  LAYER="{{ layer }}"
  CONCEPT="{{ concept }}"
  QCLASS="{{ qgis_class }}"
  SHORT="{{ short_name }}"
  HANDLE="${QCLASS}Handle"
  DIR="$CRATE/src/$LAYER/$CONCEPT"

  mkdir -p "$DIR"

  # ── header ──────────────────────────────────────────────────────────────
  cat > "$CRATE/include/$LAYER/$CONCEPT.h" << EOF
#pragma once

#include "rust/cxx.h"
#include "qgis-sys/include/core/handle.h"

namespace qgis_shim::$LAYER {

QGIS_DECLARE_HANDLE($HANDLE);

} // namespace qgis_shim::$LAYER

#include "qgis-sys/src/$LAYER/$CONCEPT/$SHORT.rs.h"

namespace qgis_shim::$LAYER {

// TODO: declare FFI functions here

} // namespace qgis_shim::$LAYER
EOF

  # ── rust bridge ─────────────────────────────────────────────────────────
  cat > "$DIR/$SHORT.rs" << EOF
#[cxx::bridge(namespace = "qgis_shim::$LAYER")]
pub mod ffi {
    unsafe extern "C++" {
        include!("qgis-sys/include/$LAYER/$CONCEPT.h");

        type $HANDLE;

        // TODO: declare FFI functions here
    }
}
EOF

  # ── cpp shim ────────────────────────────────────────────────────────────
  cat > "$DIR/$SHORT.cpp" << EOF
#include "qgis-sys/include/$LAYER/$CONCEPT.h"
#include "qgis-sys/include/core/convert.h"

// TODO: #include <qgs....h>

// QGIS_DEFINE_HANDLE_DTOR(qgis_shim::$LAYER, $HANDLE, ::$QCLASS)

namespace {

// QGIS_HANDLE_CAST(qgis_shim::$LAYER::$HANDLE, ::$QCLASS)

} // namespace

namespace qgis_shim::$LAYER {

// TODO: implement FFI functions here

} // namespace qgis_shim::$LAYER
EOF

  # ── mod.rs ──────────────────────────────────────────────────────────────
  cat > "$DIR/mod.rs" << EOF
pub mod $SHORT;
EOF

  # ── wire into parent mod.rs ─────────────────────────────────────────────
  PARENT_MOD="$CRATE/src/$LAYER/mod.rs"
  if ! grep -q "pub mod $CONCEPT;" "$PARENT_MOD" 2>/dev/null; then
    echo "pub mod $CONCEPT;" >> "$PARENT_MOD"
  fi

  # ── wire into lib.rs ────────────────────────────────────────────────────
  LIB_RS="$CRATE/src/lib.rs"
  ALIAS="${SHORT}_ffi"
  USE_LINE="pub use $LAYER::$CONCEPT::$SHORT::ffi as $ALIAS;"
  if ! grep -q "$ALIAS" "$LIB_RS" 2>/dev/null; then
    echo "$USE_LINE" >> "$LIB_RS"
  fi

  echo ""
  echo "✅ scaffolded $LAYER/$CONCEPT"
  echo "   header:  $CRATE/include/$LAYER/$CONCEPT.h"
  echo "   bridge:  $DIR/$SHORT.rs"
  echo "   shim:    $DIR/$SHORT.cpp"
  echo "   mod:     $DIR/mod.rs"
  echo ""
  echo "Next steps:"
  echo "  1. Edit the header — declare FFI functions"
  echo "  2. Edit the .rs    — declare matching Rust signatures"
  echo "  3. Edit the .cpp   — implement the functions"
  echo "  4. cargo build -p qgis-sys"
'""", default-environment = "dev" }

# ── gates ─────────────────────────────────────────────────────────────────────
# One command for "what CI will run". `gates` needs no QGIS at runtime; `ci-full`
# adds clang-tidy and the QGIS-backed test binaries, so it wants the `dev`
# environment installed: `pixi run -e dev ci-full`. Aggregators below resolve
# their environment through the tasks they depend on (pixi 0.81 limitation:
# `default-environment` requires a `cmd`).
gates = { description = "Format check + clippy + the QGIS-free test run", depends-on = [
  "fmt-check",
  "clippy",
  "lint-toml",
  "lint-actions",
  "test",
] }

ci = { description = "`gates` plus the C++ format check", depends-on = [
  "gates",
  "check-cpp",
] }

ci-full = { description = "Everything: `ci` plus clang-tidy and the QGIS-backed tests", depends-on = [
  "ci",
  "lint-cpp",
  "test-full",
] }
