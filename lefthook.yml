# lefthook — local git hooks. The hook environment always comes from pixi
# (contributors may not have bun/cargo on PATH otherwise). Package-specific
# checks invoke the environment's tools directly (the commands are owned by
# the packages' package.json scripts; hooks only need the staged-file form).
# Repo-management checks share the root tasks so hooks and CI cannot drift.
# https://lefthook.dev
#
# Only *staged* files are considered: the `glob` filters which files wake a
# hook, and `{staged_files}` expands to the staged paths pixi passes through to
# the task or command.

min_version: "2.0.0"

pre-commit:
  parallel: true
  jobs:
    - name: rust-fmt
      glob: "*.rs"
      run: pixi run -e default cargo fmt --all --check

    - name: rust-clippy
      glob: "*.rs"
      run: pixi run -e default cargo clippy --workspace --all-targets -- -D warnings

    - name: cpp-fmt
      glob: "*.{cpp,h}"
      run: pixi run -e default -- check-cpp {staged_files}

    - name: toml-fmt
      # Only pixi.toml is kept in taplo's canonical form; the rest of the repo
      # deliberately uses the aligned-`=` TOML style (see `lint-toml` in
      # pixi.toml), so the hook is scoped to the one file taplo owns.
      glob: "pixi.toml"
      run: pixi run -e default -- lint-toml {staged_files}

    - name: workflows
      glob: ".github/workflows/*.{yml,yaml}"
      run: pixi run -e default lint-actions

    - name: js-biome
      # Whole-repo enforcement is each package's own lint task fanned out by
      # turbo; the hook checks exactly the staged files instead — same global
      # biome config, focused output.
      glob: "*.{js,ts,mts,mjs,cjs,json,jsonc,css}"
      run: pixi run -e bun -- _biome {staged_files}

commit-msg:
  jobs:
    - name: convco
      # `{1}` is the file holding the proposed message (git commit-msg hook argument)
      run: pixi run -e default lint-commit < {1}

pre-push:
  jobs:
    # One call, the same code CI runs (`xtask ci`): repo lints, the turbo
    # lint fan-out, the format-drift gate, every package's tests and
    # pack:check. `gates` is `ci` minus the coverage producers, which are the
    # expensive half and are only useful once they can be uploaded.
    - name: gates
      run: pixi run gates
    # Cheap, and the one failure that cannot be fixed after a release is cut.
    - name: version-check
      glob: "{pixi.toml,Cargo.toml,**/package.json,**/pyproject.toml}"
      run: pixi run -e bun version-check
